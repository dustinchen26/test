            }

            }
        }
        .container {
            position: relative;
            z-index: 10;

        .cards {

                document.getElementById(d).innerHTML = "完成";
                document.getElementById(h).innerHTML = "--";
                document.getElementById(m).innerHTML = "--";
                document.getElementById(s).innerHTML = "--";
                return;

            const day = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff %= 1000 * 60 * 60 * 24;
            const hour = Math.floor(diff / (1000 * 60 * 60));
            diff %= 1000 * 60 * 60;
            const minute = Math.floor(diff / (1000 * 60));
            diff %= 1000 * 60;
            const second = Math.floor(diff / 1000);
            document.getElementById(d).innerHTML = day;
            document.getElementById(h).innerHTML = String(hour).padStart(2, "0");
            document.getElementById(m).innerHTML = String(minute).padStart(2, "0");
            document.getElementById(s).innerHTML = String(second).padStart(2, "0");
        }
