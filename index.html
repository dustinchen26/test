<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💕 Winny 加油！專屬倒數計時 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ----- 樣式完全保留（溫暖風格） ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 40%, #e8eaf6 100%);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            transition: background 1s ease;
        }
        body.critical-bg {
            background: linear-gradient(135deg, #fff8e1 0%, #fce4ec 30%, #f3e5f5 70%, #e8eaf6 100%);
            animation: bgShift 4s infinite alternate ease-in-out;
        }
        @keyframes bgShift {
            0% { background-size: 100% 100%; }
            100% { background-size: 150% 150%; background-position: 10% 20%; }
        }

        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-hearts span {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.15;
            animation: floatHeart 18s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) { top: 8%; left: 5%; animation-duration: 16s; font-size: 3rem; }
        .bg-hearts span:nth-child(2) { top: 20%; right: 8%; animation-duration: 20s; font-size: 2.4rem; animation-delay: 2s; }
        .bg-hearts span:nth-child(3) { bottom: 25%; left: 10%; animation-duration: 22s; font-size: 4rem; animation-delay: 4s; }
        .bg-hearts span:nth-child(4) { bottom: 10%; right: 5%; animation-duration: 18s; font-size: 2.8rem; animation-delay: 1s; }
        .bg-hearts span:nth-child(5) { top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 24s; font-size: 5rem; animation-delay: 3s; opacity: 0.06; }
        .bg-hearts span:nth-child(6) { top: 5%; left: 45%; animation-duration: 19s; font-size: 2rem; animation-delay: 5s; }
        .bg-hearts span:nth-child(7) { bottom: 40%; right: 3%; animation-duration: 21s; font-size: 3.2rem; animation-delay: 0.5s; }
        .bg-hearts span:nth-child(8) { top: 60%; left: 3%; animation-duration: 17s; font-size: 2.6rem; animation-delay: 3.5s; }
        body.critical-bg .bg-hearts span {
            animation-duration: 8s !important;
            opacity: 0.3 !important;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-40px) rotate(8deg) scale(1.05); }
            100% { transform: translateY(20px) rotate(-5deg) scale(0.95); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.58);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 44px;
            padding: 28px 24px 30px;
            box-shadow: 0 25px 60px rgba(233, 30, 99, 0.13), 0 8px 24px rgba(156, 39, 176, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h1 {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 2.0rem;
            color: #4a148c;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(233, 30, 99, 0.13);
            line-height: 1.3;
        }
        .header h1 .heart {
            color: #e91e63;
            display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            100% { transform: scale(1.18); }
        }
        .header .sub {
            font-size: 0.95rem;
            color: #7b4b8a;
            font-weight: 300;
            margin-top: 2px;
            letter-spacing: 3px;
            opacity: 0.85;
        }
        .header .sub span { font-weight: 400; color: #d81b60; }
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 2px 0 14px;
        }
        .divider .line {
            flex: 1;
            max-width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63, transparent);
            border-radius: 2px;
        }
        .divider .dot { color: #e91e63; font-size: 0.9rem; }

        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 16px 14px 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 6px 20px rgba(156, 39, 176, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(156, 39, 176, 0.10);
        }
        .card.glow-card {
            border: 2px solid #ff4081;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.6), 0 0 60px rgba(255, 64, 129, 0.3);
            animation: glowPulse 1.2s infinite alternate ease-in-out;
            background: rgba(255, 255, 255, 0.7);
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 20px rgba(255, 64, 129, 0.4), 0 0 40px rgba(255, 64, 129, 0.1); border-color: #ff4081; }
            100% { box-shadow: 0 0 40px rgba(255, 64, 129, 0.9), 0 0 80px rgba(255, 23, 68, 0.4); border-color: #ff1744; }
        }

        .card .exam-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #4a148c;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }
        .card .exam-date {
            font-size: 0.82rem;
            font-weight: 300;
            color: #7b4b8a;
            margin-top: 1px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .card .exam-date .roc { font-weight: 400; color: #6a1b9a; }
        .card .countdown-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #c2185b;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 3px;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            padding: 0 2px;
        }
        .countdown-display .time-block {
            display: inline-flex;
            align-items: baseline;
            gap: 1px;
        }
        .countdown-display .num {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2.4rem;
            color: #4a148c;
            line-height: 1.15;
            min-width: 40px;
            text-align: center;
            background: rgba(233, 30, 99, 0.05);
            border-radius: 8px;
            padding: 0 2px;
            transition: all 0.3s ease;
        }
        .countdown-display .num.days {
            font-size: 2.9rem;
            color: #c2185b;
            min-width: 52px;
            background: rgba(233, 30, 99, 0.07);
        }
        .countdown-display .num.days.critical-days {
            color: #ff1744 !important;
            background: rgba(255, 23, 68, 0.2) !important;
            animation: criticalPulse 0.8s infinite alternate ease-in-out;
            text-shadow: 0 0 20px rgba(255, 23, 68, 0.5);
        }
        @keyframes criticalPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.25); }
        }

        .countdown-display .label {
            font-size: 0.75rem;
            font-weight: 400;
            color: #7b4b8a;
            margin: 0 1px 0 0;
            line-height: 1.2;
        }
        .card.done-card {
            background: rgba(255, 255, 255, 0.3);
            opacity: 0.7;
        }
        .card.done-card .num {
            color: #9e9e9e !important;
            background: rgba(0, 0, 0, 0.04) !important;
            animation: none !important;
            text-shadow: none !important;
            transform: scale(1) !important;
        }
        .card.done-card .exam-name { color: #7b4b8a; }
        .card.done-card .countdown-label { color: #9e9e9e; }
        .card.done-card.glow-card {
            box-shadow: none !important;
            border-color: rgba(255, 255, 255, 0.7) !important;
            animation: none !important;
        }

        .cheer-section {
            margin-top: 2px;
            padding-top: 14px;
            border-top: 2px dashed rgba(233, 30, 99, 0.15);
            text-align: center;
        }
        .cheer-section .cheer-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #4a148c;
            letter-spacing: 3px;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .cheer-section .cheer-label .icon {
            display: inline-block;
            animation: sparkle 2.4s infinite alternate;
        }
        @keyframes sparkle {
            0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.15) rotate(8deg); opacity: 1; }
        }
        .cheer-message {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 10px 22px;
            border-radius: 50px;
            display: inline-block;
            max-width: 100%;
            box-shadow: 0 2px 12px rgba(156, 39, 176, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            line-height: 1.5;
            transition: all 0.3s ease;
        }
        .cheer-message:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.01);
        }

        .footer-note {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #b39ddb;
            letter-spacing: 2px;
            font-weight: 400;
            text-align: center;
            border-top: 1px solid rgba(233, 30, 99, 0.1);
            padding-top: 14px;
        }
        .footer-note span {
            color: #e91e63;
            font-weight: 600;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInModal 0.5s ease;
        }
        @keyframes fadeInModal {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-box {
            background: linear-gradient(145deg, #ffffff, #fce4ec);
            border-radius: 40px;
            padding: 30px 40px 25px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(233, 30, 99, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .modal-box .modal-icon {
            font-size: 4rem;
            margin-bottom: 6px;
        }
        .modal-box h2 {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-size: 1.8rem;
            color: #4a148c;
            margin-bottom: 8px;
        }
        .modal-box p {
            font-size: 1.1rem;
            color: #4a148c;
            line-height: 1.6;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .modal-box .highlight {
            color: #c2185b;
            font-weight: 900;
            font-size: 1.3rem;
        }
        .modal-close-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
            letter-spacing: 2px;
        }
        .modal-close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 28px rgba(233, 30, 99, 0.5);
        }
        .modal-close-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 680px) {
            .container { padding: 18px 12px 20px; border-radius: 28px; }
            .header h1 { font-size: 1.6rem; letter-spacing: 1px; }
            .header .sub { font-size: 0.8rem; letter-spacing: 2px; }
            .header { margin-bottom: 8px; }
            .divider { margin: 0 0 10px; gap: 6px; }
            .divider .line { max-width: 30px; }
            .countdown-grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
            .card { padding: 12px 10px 14px; border-radius: 18px; }
            .card .exam-name { font-size: 0.95rem; letter-spacing: 1px; }
            .card .exam-date { font-size: 0.72rem; margin-bottom: 2px; }
            .card .countdown-label { font-size: 0.8rem; margin-bottom: 4px; }
            .countdown-display { gap: 2px; padding: 0 1px; justify-content: center; }
            .countdown-display .num { font-size: 1.7rem; min-width: 28px; border-radius: 6px; padding: 0 1px; }
            .countdown-display .num.days { font-size: 2.1rem; min-width: 38px; }
            .countdown-display .label { font-size: 0.6rem; margin: 0 0px 0 0; }
            .cheer-section { padding-top: 10px; margin-top: 0; }
            .cheer-section .cheer-label { font-size: 0.85rem; margin-bottom: 4px; }
            .cheer-message { font-size: 0.95rem; padding: 8px 16px; border-radius: 40px; }
            .footer-note { font-size: 0.8rem; padding-top: 10px; margin-top: 12px; }
            .bg-hearts span { font-size: 1.2rem !important; }
            .modal-box { padding: 20px 20px 20px; }
            .modal-box h2 { font-size: 1.4rem; }
            .modal-box p { font-size: 1rem; }
        }
        @media (max-width: 400px) {
            .container { padding: 12px 8px 16px; border-radius: 22px; }
            .header h1 { font-size: 1.3rem; }
            .header .sub { font-size: 0.7rem; }
            .card { padding: 8px 6px 10px; border-radius: 14px; }
            .card .exam-name { font-size: 0.8rem; }
            .card .exam-date { font-size: 0.6rem; margin-bottom: 2px; }
            .card .countdown-label { font-size: 0.7rem; margin-bottom: 2px; }
            .countdown-display .num { font-size: 1.3rem; min-width: 22px; }
            .countdown-display .num.days { font-size: 1.7rem; min-width: 30px; }
            .countdown-display .label { font-size: 0.5rem; }
            .cheer-message { font-size: 0.8rem; padding: 6px 12px; }
            .footer-note { font-size: 0.7rem; }
            .modal-box { padding: 16px 12px 18px; }
        }
    </style>
</head>
<body>

    <div class="bg-hearts">
        <span>💕</span><span>🌸</span><span>💖</span><span>✨</span>
        <span>💗</span><span>🌷</span><span>💝</span><span>🦋</span>
    </div>

    <!-- 飄落特效 Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <div class="container">
        <div class="header">
            <h1><span class="heart">💕</span> Winny 加油！專屬倒數計時 <span class="heart">💕</span></h1>
            <div class="sub">每天都為你打氣，開心迎接挑戰！&nbsp; <span>✨</span></div>
        </div>

        <div class="divider">
            <span class="line"></span>
            <span class="dot">❤️</span>
            <span class="line"></span>
        </div>

        <div class="countdown-grid" id="countdownGrid">
            <div class="card" id="card1">
                <div class="exam-name">📖 內科筆試考試</div>
                <div class="exam-date">民國 <span class="roc">115/08/15</span></div>
                <div class="countdown-label" id="label1">倒數 -- 天</div>
                <div class="countdown-display" id="countdown1">
                    <span class="time-block"><span class="num days" id="d1">--</span><span class="label">天</span></span>
                    <span class="time-block"><span class="num" id="h1">--</span><span class="label">時</span></span>
                    <span class="time-block"><span class="num" id="m1">--</span><span class="label">分</span></span>
                    <span class="time-block"><span class="num" id="s1">--</span><span class="label">秒</span></span>
                </div>
            </div>

            <div class="card" id="card2">
                <div class="exam-name">🎤 內科口試考試</div>
                <div class="exam-date">民國 <span class="roc">115/09/20</span></div>
                <div class="countdown-label" id="label2">倒數 -- 天</div>
                <div class="countdown-display" id="countdown2">
                    <span class="time-block"><span class="num days" id="d2">--</span><span class="label">天</span></span>
                    <span class="time-block"><span class="num" id="h2">--</span><span class="label">時</span></span>
                    <span class="time-block"><span class="num" id="m2">--</span><span class="label">分</span></span>
                    <span class="time-block"><span class="num" id="s2">--</span><span class="label">秒</span></span>

            <span>❤️</span> 你永遠是最棒的，Winny 加油！ <span>❤️</span>
        </div>

    <script>
        // ============================================================
        // 1. 目標日期
        // ============================================================
        const TARGETS = [{
            id: 1,
            name: '內科筆試',
            year: 2026,
            month: 7,
            day: 15,
            dId: 'd1',
            hId: 'h1',
            mId: 'm1',
            sId: 's1',
            cardId: 'card1',
            labelId: 'label1'
        }, {
            id: 2,
            name: '內科口試',
            year: 2026,
            month: 8,
            day: 20,
            dId: 'd2',
            hId: 'h2',
            mId: 'm2',
            sId: 's2',
            cardId: 'card2',
            labelId: 'label2'
        }];

        const targets = TARGETS.map(t => ({
            ...t,
            date: new Date(t.year, t.month, t.day)
        }));

        // ============================================================
        // 2. 每日鼓勵小語（附日期註解）
        // ============================================================
        function getDailyMessage(index) {
            const general = [
                "今天也是充滿希望的一天！",
                "你笑得最好看，記得常微笑 😊",
                "全力以赴，但也要記得休息喔～",

                "保持開心，好事就會發生！",
                "你是獨一無二的，無可取代！",
                "加油！我永遠支持你 💪",
                "放鬆心情，一切都會順利。",
                "今天的你，依然閃閃發光 ✨",
                "享受過程，結果自然美好。",
                "無論如何，你都是最棒的！",
                "積極的心態，是最好的魔法。",
                "今天也要好好愛自己 ❤️",
                "勇敢追夢，我會一直陪著你。",
                "保持熱情，生活會回報你驚喜。",
                "你是我的驕傲，加油！",
                "笑一個，世界會更美好。",
                "你擁有無限可能，盡情展現吧！",
                "每天都是嶄新的開始，出發！",
                "你的努力一定會開花結果 🌸",
                "今天要對自己好一點，你值得。",
                "不管多累，我都會在身邊。",
                "保持節奏，穩穩地前進。",
                "你已經做得很好了，繼續加油！",
                "開心是最重要的，別忘了喔。",
                "你是最閃亮的星星 🌟",
                "今天也要元氣滿滿！",
                "相信自己，你可以的！",
                "無論風雨，我都陪你一起走。"
            ];

            if (index <= 22) return general[index % general.length];
            if (index <= 33) return general[index % general.length];
            if (index === 34) return "📣 倒數3天！你超棒的，保持節奏，穩穩來！"; // 8/12
            if (index === 35) return "📣 倒數2天！心情放鬆，發揮你的實力，一定沒問題！"; // 8/13
            if (index === 36) return "📣 倒數1天！好好休息，明天帶著笑容上場，我為你加油！"; // 8/14
            if (index === 37) return "🎉 就是今天！你準備好了，展現最棒的自己，我永遠支持你！"; // 8/15
            if (index <= 69) return general[index % general.length];
            if (index === 70) return "🎤 倒數3天！保持自信，你已經很棒了！"; // 9/17
            if (index === 71) return "🎤 倒數2天！從容應對，你一定能做到！"; // 9/18
            if (index === 72) return "🎤 倒數1天！放鬆心情，明天就是你的舞台！"; // 9/19
            if (index === 73) return "🎉 就是今天！全力以赴，享受過程，我為你驕傲！"; // 9/20
            return "💖 每一天都是新的開始，加油！";
        }

        // ============================================================
        // 3. 取得當日小語 + 顯示日期（民國年）
        // ============================================================
        function getTodayCheer() {
            const now = new Date();
            const baseDate = new Date(2026, 6, 9);
            const diffDays = Math.floor((now - baseDate) / (1000 * 60 * 60 * 24));
            let message;
            if (diffDays >= 0 && diffDays <= 73) {
                message = getDailyMessage(diffDays);
            } else if (diffDays > 73) {
                message = "🎉 太棒了！所有挑戰都完成了，你超級厲害！🏆";
            } else {
                message = "💖 準備好了嗎？每一天都是新的開始，加油！";
            }

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const rocYear = year - 1911;
            const dateStr = `（民國 ${rocYear}/${month}/${day}）`;
            return message + ' ' + dateStr;
        }

        // ============================================================
        // 4. ★ 飄落特效（調低密度、尺寸，更清爽）
        // ============================================================
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let animationId = null;
        let isConfettiRunning = false;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 只保留五種輕柔符號
        const symbols = ['💖', '✨', '🌸', '💕', '🦋'];

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                // 尺寸縮小為 10~20px
                this.size = Math.random() * 10 + 10;
                // 速度稍微降低
                this.speedY = Math.random() * 1.2 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.rotation = Math.random() * 360;
                this.rotateSpeed = (Math.random() - 0.5) * 2;
                this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
                this.opacity = Math.random() * 0.3 + 0.3; // 透明度降低
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.01) * 0.2;
                this.rotation += this.rotateSpeed;
                if (this.y > height + 50) { this.reset();
                    this.y = -50; }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.font = `${this.size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = this.opacity;
                ctx.fillText(this.symbol, 0, 0);
                ctx.restore();
            }
        }

        function startConfetti() {
            if (isConfettiRunning) return;
            isConfettiRunning = true;
            // 粒子數量從 70 減少為 30
            for (let i = 0; i < 30; i++) {
                const p = new Particle();
                p.y = Math.random() * height;
                particles.push(p);
            }
            animateConfetti();
        }

        function stopConfetti() {
            isConfettiRunning = false;
            if (animationId) { cancelAnimationFrame(animationId);
                animationId = null; }
            ctx.clearRect(0, 0, width, height);
            particles = [];
        }

        function animateConfetti() {
            if (!isConfettiRunning) return;
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update();
                p.draw(); });
            animationId = requestAnimationFrame(animateConfetti);
        }

        // ============================================================
        // 5. 彈出視窗（每次刷新都會彈出）
        // ============================================================
        function showModal(examName, days) {
            let title = `💪 親愛的，加油！`;
            let body = `${examName} 只剩 <span class="highlight">${days} 天</span> ！<br>你已經準備得超棒了，保持笑容，盡力就好！<br><span style="font-size:0.9rem; color:#7b4b8a;">我會一直在你身邊 💕</span>`;
            let icon = '💖';

            if (examName.includes('內科筆試')) {
                icon = '📖';
                title = '📖 內科筆試倒數！';
                body = `${examName} 只剩 <span class="highlight">${days} 天</span> ！<br>穩定心情，相信自己的實力，你一定可以！<br><span style="font-size:0.9rem; color:#7b4b8a;">盡力就是最好的表現 ✨</span>`;
            } else if (examName.includes('內科口試')) {
                icon = '🎤';
                title = '🎤 內科口試倒數！';
                body = `${examName} 只剩 <span class="highlight">${days} 天</span> ！<br>從容應對，展現最自信的你，沒問題的！<br><span style="font-size:0.9rem; color:#7b4b8a;">你永遠是我的驕傲 🌟</span>`;
            }

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-icon">${icon}</div>
                    <h2>${title}</h2>
                    <p>${body}</p>
                    <button class="modal-close-btn">好，我會加油！</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.querySelector('.modal-close-btn').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        // ============================================================
        // 6. 倒數更新 + 特效（考前五天啟動）
        // ============================================================
        function padZero(n) { return String(n).padStart(2, '0'); }

        function updateCountdown() {
            const now = new Date();
            let anyCritical = false;

            targets.forEach(t => {
                const targetDate = t.date;
                const diffMs = targetDate - now;
                const isDone = diffMs <= 0;

                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const cardEl = document.getElementById(t.cardId);
                const labelEl = document.getElementById(t.labelId);

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00';
                    mEl.textContent = '00';
                    sEl.textContent = '00';
                    cardEl.classList.add('done-card');
                    cardEl.classList.remove('glow-card');
                    dEl.classList.remove('critical-days');
                    labelEl.textContent = `${t.name} 已結束`;
                    return;
                }

                cardEl.classList.remove('done-card');
                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.ceil(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);
                labelEl.textContent = `${t.name}倒數 ${days} 天`;

                const isCritical = (days >= 1 && days <= 5);
                if (isCritical) {
                    anyCritical = true;
                    cardEl.classList.add('glow-card');
                    dEl.classList.add('critical-days');
                } else {
                    cardEl.classList.remove('glow-card');
                    dEl.classList.remove('critical-days');
                }
            });

            const bodyEl = document.body;
            if (anyCritical) {
                bodyEl.classList.add('critical-bg');
                startConfetti();
            } else {
                bodyEl.classList.remove('critical-bg');
                stopConfetti();
            }
        }

        // ============================================================
        // 7. 初始化（每次刷新彈出最緊急的考試提醒）
        // ============================================================
        function init() {
            document.getElementById('cheerMessage').textContent = getTodayCheer();
            updateCountdown();
            setInterval(updateCountdown, 1000);

            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                const todayStr = now.toDateString();
                if (todayStr !== lastDateStr) {
                    lastDateStr = todayStr;
                    document.getElementById('cheerMessage').textContent = getTodayCheer();
                }
            }, 60000);

            // 每次載入頁面檢查考前五天內，彈出最緊急的考試提醒
            const now = new Date();
            const criticalExams = targets.filter(t => {
                const diff = t.date - now;
                if (diff > 0) {
                    const days = Math.ceil(diff / 86400000);
                    return days >= 1 && days <= 5;
                }
                return false;
            });

            if (criticalExams.length > 0) {
                criticalExams.sort((a, b) => {
                    const da = Math.ceil((a.date - now) / 86400000);
                    const db = Math.ceil((b.date - now) / 86400000);
                    return da - db;
                });
                const exam = criticalExams[0];
                const days = Math.ceil((exam.date - now) / 86400000);
                setTimeout(() => {
                    showModal(exam.name, days);
                }, 500);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
