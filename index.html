<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ----- 全域樣式 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 40%, #e8eaf6 100%);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-hearts span {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.15;
            animation: floatHeart 18s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) {
            top: 8%;
            left: 5%;
            animation-duration: 16s;
            font-size: 3rem;
        }
        .bg-hearts span:nth-child(2) {
            top: 20%;
            right: 8%;
            animation-duration: 20s;
            font-size: 2.4rem;
            animation-delay: 2s;
        }
        .bg-hearts span:nth-child(3) {
            bottom: 25%;
            left: 10%;
            animation-duration: 22s;
            font-size: 4rem;
            animation-delay: 4s;
        }
        .bg-hearts span:nth-child(4) {
            bottom: 10%;
            right: 5%;
            animation-duration: 18s;
            font-size: 2.8rem;
            animation-delay: 1s;
        }
        .bg-hearts span:nth-child(5) {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 24s;
            font-size: 5rem;
            animation-delay: 3s;
            opacity: 0.06;
        }
        .bg-hearts span:nth-child(6) {
            top: 5%;
            left: 45%;
            animation-duration: 19s;
            font-size: 2rem;
            animation-delay: 5s;
        }
        .bg-hearts span:nth-child(7) {
            bottom: 40%;
            right: 3%;
            animation-duration: 21s;
            font-size: 3.2rem;
            animation-delay: 0.5s;
        }
        .bg-hearts span:nth-child(8) {
            top: 60%;
            left: 3%;
            animation-duration: 17s;
            font-size: 2.6rem;
            animation-delay: 3.5s;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            50% {
                transform: translateY(-40px) rotate(8deg) scale(1.05);
            }
            100% {
                transform: translateY(20px) rotate(-5deg) scale(0.95);
            }
        }

        /* ----- 主卡片容器 ----- */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.58);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 44px;
            padding: 28px 24px 30px;
            box-shadow: 0 25px 60px rgba(233, 30, 99, 0.13), 0 8px 24px rgba(156, 39, 176, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ----- 標題 ----- */
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h1 {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 2.0rem;
            color: #4a148c;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(233, 30, 99, 0.13);
            line-height: 1.3;
        }
        .header h1 .heart {
            color: #e91e63;
            display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.18);
            }
        }
        .header .sub {
            font-size: 0.95rem;
            color: #7b4b8a;
            font-weight: 300;
            margin-top: 2px;
            letter-spacing: 3px;
            opacity: 0.85;
        }
        .header .sub span {
            font-weight: 400;
            color: #d81b60;
        }

        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 2px 0 14px;
        }
        .divider .line {
            flex: 1;
            max-width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63, transparent);
            border-radius: 2px;
        }
        .divider .dot {
            color: #e91e63;
            font-size: 0.9rem;
        }

        /* ----- 倒計時卡片（兩個並排） ----- */
        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 22px;
            padding: 16px 14px 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 6px 20px rgba(156, 39, 176, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(156, 39, 176, 0.10);
        }

        .card .exam-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #4a148c;
            letter-spacing: 1.5px;
            line-height: 1.3;
        }
        .card .exam-date {
            font-size: 0.82rem;
            font-weight: 300;
            color: #7b4b8a;
            margin-top: 1px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .card .exam-date .roc {
            font-weight: 400;
            color: #6a1b9a;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 3px;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            padding: 0 2px;
        }
        .countdown-display .time-block {
            display: inline-flex;
            align-items: baseline;
            gap: 1px;
        }
        .countdown-display .num {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2.4rem;
            color: #4a148c;
            line-height: 1.15;
            min-width: 40px;
            text-align: center;
            background: rgba(233, 30, 99, 0.05);
            border-radius: 8px;
            padding: 0 2px;
        }
        .countdown-display .num.days {
            font-size: 2.9rem;
            color: #c2185b;
            min-width: 52px;
            background: rgba(233, 30, 99, 0.07);
        }
        .countdown-display .label {
            font-size: 0.75rem;
            font-weight: 400;
            color: #7b4b8a;
            margin: 0 1px 0 0;
            line-height: 1.2;
        }

        .card.done-card {
            background: rgba(255, 255, 255, 0.3);
            opacity: 0.7;
        }
        .card.done-card .num {
            color: #9e9e9e !important;
            background: rgba(0, 0, 0, 0.04) !important;
        }
        .card.done-card .exam-name {
            color: #7b4b8a;
        }

        /* ----- 加油小語（唯一區域） ----- */
        .cheer-section {
            margin-top: 2px;
            padding-top: 14px;
            border-top: 2px dashed rgba(233, 30, 99, 0.15);
            text-align: center;
        }
        .cheer-section .cheer-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #4a148c;
            letter-spacing: 3px;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .cheer-section .cheer-label .icon {
            display: inline-block;
            animation: sparkle 2.4s infinite alternate;
        }
        @keyframes sparkle {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: scale(1.15) rotate(8deg);
                opacity: 1;
            }
        }

        .cheer-message {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 10px 22px;
            border-radius: 50px;
            display: inline-block;
            max-width: 100%;
            box-shadow: 0 2px 12px rgba(156, 39, 176, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            line-height: 1.5;
            transition: all 0.3s ease;
        }
        .cheer-message:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.01);
        }

        .footer-note {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #b39ddb;
            letter-spacing: 2px;
            font-weight: 300;
            text-align: center;
        }
        .footer-note span {
            color: #e91e63;
        }

        /* ----- RWD 手機緊湊排版 ----- */
        @media (max-width: 680px) {
            .container {
                padding: 18px 12px 20px;
                border-radius: 28px;
            }
            .header h1 {
                font-size: 1.6rem;
                letter-spacing: 1px;
            }
            .header .sub {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
            .header {
                margin-bottom: 8px;
            }
            .divider {
                margin: 0 0 10px;
                gap: 6px;
            }
            .divider .line {
                max-width: 30px;
            }

            .countdown-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 12px;
            }

            .card {
                padding: 12px 10px 14px;
                border-radius: 18px;
            }
            .card .exam-name {
                font-size: 0.95rem;
                letter-spacing: 1px;
            }
            .card .exam-date {
                font-size: 0.72rem;
                margin-bottom: 4px;
                letter-spacing: 0.5px;
            }

            .countdown-display {
                gap: 2px;
                padding: 0 1px;
                justify-content: center;
            }
            .countdown-display .num {
                font-size: 1.7rem;
                min-width: 28px;
                border-radius: 6px;
                padding: 0 1px;
            }
            .countdown-display .num.days {
                font-size: 2.1rem;
                min-width: 38px;
            }
            .countdown-display .label {
                font-size: 0.6rem;
                margin: 0 0px 0 0;
            }
            .countdown-display .time-block {
                gap: 0px;
            }

            .cheer-section {
                padding-top: 10px;
                margin-top: 0;
            }
            .cheer-section .cheer-label {
                font-size: 0.85rem;
                margin-bottom: 4px;
            }
            .cheer-message {
                font-size: 0.95rem;
                padding: 8px 16px;
                line-height: 1.4;
                border-radius: 40px;
            }
            .footer-note {
                margin-top: 8px;
                font-size: 0.65rem;
                letter-spacing: 1px;
            }
            .bg-hearts span {
                font-size: 1.2rem !important;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 12px 8px 16px;
                border-radius: 22px;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .header .sub {
                font-size: 0.7rem;
            }
            .card {
                padding: 8px 6px 10px;
                border-radius: 14px;
            }
            .card .exam-name {
                font-size: 0.8rem;
            }
            .card .exam-date {
                font-size: 0.6rem;
                margin-bottom: 2px;
            }
            .countdown-display .num {
                font-size: 1.3rem;
                min-width: 22px;
            }
            .countdown-display .num.days {
                font-size: 1.7rem;
                min-width: 30px;
            }
            .countdown-display .label {
                font-size: 0.5rem;
            }
            .countdown-display {
                gap: 1px;
                overflow-x: auto;
                justify-content: flex-start;
                padding: 0 2px;
            }
            .cheer-message {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .cheer-section .cheer-label {
                font-size: 0.75rem;
            }
            .footer-note {
                font-size: 0.55rem;
            }
            .countdown-grid {
                gap: 6px;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

        // ============================================================

        //    以筆試剩餘天數為準（1~73 顯示倒數句，其餘隨機）
        // ============================================================
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            return Math.floor(diff / (1000 * 60 * 60 * 24));
        }

        function getTodayCheer() {
            const now = new Date();
            const examDate = new Date(2026, 7, 15); // 筆試 2026/08/15
            const diffMs = examDate - now;
            const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

            // 如果剩餘天數在 1~73 之間，使用倒數句
            if (daysLeft >= 1 && daysLeft <= 73) {
                const idx = 73 - daysLeft; // 73天→索引0, 1天→索引72
                return COUNTDOWN_MESSAGES[idx] || COUNTDOWN_MESSAGES[0];
            }

            // 否則從普通勵志語中隨機選取
            const dayOfYear = getDayOfYear(now);
            const idx = dayOfYear % GENERAL_MESSAGES.length;
            return GENERAL_MESSAGES[idx];
        }

        // ============================================================
        // 4. 更新倒計時（只更新數字，不顯示額外文字）
        // ============================================================
        function padZero(n) {
            return String(n).padStart(2, '0');
        }

        function updateCountdown() {
            const now = new Date();

            targets.forEach(t => {
                const targetDate = t.date;
                const diffMs = targetDate - now;
                const isDone = diffMs <= 0;

                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const cardEl = document.getElementById(t.cardId);

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00';
                    mEl.textContent = '00';
                    sEl.textContent = '00';
                    cardEl.classList.add('done-card');
                    return;
                }

                cardEl.classList.remove('done-card');

                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);
            });
        }

        // ============================================================
        // 5. 初始化
        // ============================================================
        function init() {
            const cheerEl = document.getElementById('cheerMessage');
            cheerEl.textContent = getTodayCheer();

            updateCountdown();
            setInterval(updateCountdown, 1000);

            // 每日更新小語
            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                const todayStr = now.toDateString();
                if (todayStr !== lastDateStr) {
                    lastDateStr = todayStr;
                    cheerEl.textContent = getTodayCheer();
                }
            }, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
