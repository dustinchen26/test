        /* ----- 全局重置 & 背景 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fce4ec 0%, #f3e5f5 100%);
            padding: 8px;
            position: relative;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* 背景浮動愛心 */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-hearts span {
            position: absolute;
            font-size: 2rem;
            opacity: 0.08;
            animation: floatHeart 20s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) { top: 10%; left: 8%; animation-duration: 18s; }
        .bg-hearts span:nth-child(2) { top: 25%; right: 12%; animation-duration: 22s; animation-delay: 2s; }
        .bg-hearts span:nth-child(3) { bottom: 30%; left: 5%; animation-duration: 24s; animation-delay: 4s; }
        .bg-hearts span:nth-child(4) { bottom: 15%; right: 8%; animation-duration: 16s; animation-delay: 1s; }
        .bg-hearts span:nth-child(5) { display: none; }

        @keyframes floatHeart {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(4deg); }
        }

        /* ----- 主容器 ----- */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 18px 16px 20px;
            box-shadow: 0 10px 30px rgba(156, 39, 176, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow: visible;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }
        .header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            color: #4a148c;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .header h1 .heart {
            color: #e91e63;
            display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        .header .sub {
            font-size: 0.8rem;
            color: #7b4b8a;
            font-weight: 300;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 4px 0 12px;
        }
        .divider .line {
            width: 30px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63);
            border-radius: 2px;
        }
        .divider .line:last-child {
            background: linear-gradient(90deg, #e91e63, transparent);
        }
        .divider .dot { color: #e91e63; font-size: 0.7rem; }

        /* 倒數卡片 */
        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 12px 8px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 10px rgba(156, 39, 176, 0.04);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
        }

        .card.urgent {
            border: 2px solid #ff4081;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.15);
            animation: softGlow 1.5s infinite alternate;
        }
        @keyframes softGlow {
            0% { box-shadow: 0 0 8px rgba(255, 64, 129, 0.1); }
            100% { box-shadow: 0 0 20px rgba(255, 64, 129, 0.2); }
        }

        .card .exam-name {
            font-size: 1rem;
            font-weight: 700;
            color: #4a148c;
            letter-spacing: 0.5px;
        }
        .card .exam-date {
            font-size: 0.7rem;
            color: #7b4b8a;
            margin: 0 0 4px;
        }
        .card .exam-date .roc { font-weight: 500; color: #6a1b9a; }
        .card .countdown-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #c2185b;
            margin-bottom: 4px;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 2px;
            flex-wrap: wrap;
        }
        .countdown-display .time-block {
            display: inline-flex;
            align-items: baseline;
            gap: 1px;
        }
        .countdown-display .num {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #4a148c;
            min-width: 28px;
            text-align: center;
            background: rgba(233, 30, 99, 0.04);
            border-radius: 4px;
            padding: 0 2px;
            line-height: 1.2;
        }
        .countdown-display .num.days {
            font-size: 2.2rem;
            color: #c2185b;
            min-width: 38px;
            background: rgba(233, 30, 99, 0.06);
        }
        .countdown-display .label {
            font-size: 0.6rem;
            font-weight: 400;
            color: #7b4b8a;
            margin-right: 1px;
        }

        .card.done {
            opacity: 0.6;
        }
        .card.done .num {
            color: #9e9e9e !important;
            background: rgba(0, 0, 0, 0.03) !important;
        }

        /* 應援訊息 */
        .cheer-section {
            margin-top: 4px;
            padding-top: 10px;
            border-top: 2px dashed rgba(233, 30, 99, 0.12);
            text-align: center;
        }
        .cheer-message {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }

        /* ----- 維尼專區（永遠顯示） ----- */

            text-align: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px dashed rgba(233, 30, 99, 0.15);

            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(233, 30, 99, 0.08);
        }
        .pooh-container .pooh-text {
            font-size: 0.85rem;
            color: #4a148c;
            font-weight: 600;
            margin-top: 4px;
        }

        .footer-note {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #b39ddb;
            text-align: center;
            border-top: 1px solid rgba(233, 30, 99, 0.08);
            padding-top: 10px;
            padding-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .footer-note span { color: #e91e63; font-weight: 600; }

        /* ----- 大熊特效（永遠顯示） ----- */
        #bigBear {
            position: fixed;
            bottom: 12%;
            left: -20%;
            font-size: 50px;
            z-index: 9999;
            pointer-events: none;
            line-height: 1;
            transform-origin: center bottom;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #bigBear.active {
            opacity: 1;
            animation: bearWalk 6s ease-in-out infinite;
        }
        @keyframes bearWalk {
            0% { transform: translateX(-10vw) scale(0.3); opacity: 0.6; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateX(100vw) scale(2.0); opacity: 0.4; }
        }

        /* ----- 煙火特效 Canvas (全螢幕覆蓋) ----- */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            display: none;
        }
        #fireworksCanvas.active {
            display: block;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 680px) {
            .container { padding: 12px 10px; border-radius: 24px; }
            .header h1 { font-size: 1.3rem; }
            .countdown-grid { grid-template-columns: 1fr; gap: 10px; }
            .countdown-display .num { font-size: 1.6rem; min-width: 24px; }
            .countdown-display .num.days { font-size: 2.0rem; min-width: 34px; }
            .cheer-message { font-size: 0.85rem; padding: 4px 12px; }
            #bigBear { bottom: 8%; font-size: 40px; }
            @keyframes bearWalk {
                0% { transform: translateX(-10vw) scale(0.25); opacity: 0.6; }
                100% { transform: translateX(100vw) scale(1.6); opacity: 0.4; }
            }
        }
        @media (max-width: 400px) {

            .header .sub { font-size: 0.7rem; }
            .card { padding: 8px 4px 10px; }
            .card .exam-name { font-size: 0.9rem; }
            .countdown-display .num { font-size: 1.3rem; min-width: 20px; }
            .countdown-display .num.days { font-size: 1.6rem; min-width: 28px; }
            .countdown-display .label { font-size: 0.5rem; }
            .cheer-message { font-size: 0.8rem; padding: 4px 10px; }
            .footer-note { font-size: 0.65rem; padding-top: 6px; margin-top: 6px; }
            #bigBear { bottom: 5%; font-size: 30px; }
            @keyframes bearWalk {
                0% { transform: translateX(-10vw) scale(0.2); opacity: 0.6; }
                100% { transform: translateX(100vw) scale(1.4); opacity: 0.4; }
            }
        }

        .modal-overlay {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 20px 20px 18px;
            max-width: 400px;
            width: 90%;
            text-align: center;

            width: 100%;

            height: auto;
            border-radius: 12px;

        .modal-box h2 {

            color: #4a148c;

            line-height: 1.3;

            font-size: 1rem;
            color: #4a148c;
            line-height: 1.5;
            font-weight: 600;

            background: rgba(233, 30, 99, 0.06);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 6px 0 10px;

        .modal-close-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 8px 28px;
            border-radius: 50px;

            font-weight: 700;
            cursor: pointer;

            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.25);

            "最後衝刺，全力以赴！", // 68: 9/15
            "你已經準備萬全，Winny 加油！", // 69: 9/16
            "🎤 倒數3天！展現自信，你已經很棒了！", // 70: 9/17
            "🎤 倒數2天！從容應對，展現最好的自己！", // 71: 9/18
            "🎤 倒數1天！放鬆心情，明天就是你的舞台！", // 72: 9/19
            "🎉 就是今天！全力以赴，我為你驕傲！" // 73: 9/20
        ];

        // 安全取得今日訊息
        function getTodayCheer() {
            const now = new Date();
            const baseDate = new Date(2026, 6, 9); // 7月9日
            const diffDays = Math.floor((now - baseDate) / (1000 * 60 * 60 * 24));

            let message = '';
            if (diffDays >= 0 && diffDays < DAILY_MESSAGES.length) {
                message = DAILY_MESSAGES[diffDays];
            } else if (diffDays >= DAILY_MESSAGES.length) {
                message = "🎉 太棒了！所有挑戰都完成了，你超級厲害！🏆";
            } else {
                message = "💖 準備好了嗎？每一天都是新的開始，加油！";
            }

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const rocYear = year - 1911;
            return message + ' （民國 ' + rocYear + '/' + month + '/' + day + '）';
        }

        // ============================================================
        // 3. 倒數更新 & 煙火觸發
        // ============================================================
        function padZero(n) { return String(n).padStart(2, '0'); }

        // ----- 煙火系統 -----
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let fireworksActive = false;
        let particles = [];
        let animationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8 - 2
                };
                this.alpha = 1;
                this.decay = 0.01 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 4;
                this.gravity = 0.05;
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bb5', '#f9ca24', '#ff9ff3'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 40 + Math.floor(Math.random() * 30);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            if (!fireworksActive) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 隨機產生新煙火
            if (Math.random() < 0.08) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.6;
                createExplosion(x, y);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            animationId = requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            if (fireworksActive) return;
            fireworksActive = true;
            canvas.classList.add('active');
            particles = [];
            if (animationId) cancelAnimationFrame(animationId);
            animateFireworks();
        }

        function stopFireworks() {
            fireworksActive = false;
            canvas.classList.remove('active');
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        // 檢查今天是否為考試日
        function isExamDay() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();
            const d = now.getDate();
            return targets.some(t => t.year === y && t.month === m && t.day === d);
        }

        // ----- 倒數更新函數 -----
        function updateCountdown() {
            const now = new Date();
            const examDay = isExamDay();
            if (examDay) {
                startFireworks();
            } else {
                stopFireworks();
            }

            targets.forEach(t => {
                const targetDate = t.date;
                const diffMs = targetDate - now;
                const isDone = diffMs <= 0;

                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const cardEl = document.getElementById(t.cardId);
                const labelEl = document.getElementById(t.labelId);

                if (!dEl || !cardEl) return;

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00';
                    mEl.textContent = '00';
                    sEl.textContent = '00';
                    cardEl.classList.add('done');
                    cardEl.classList.remove('urgent');
                    labelEl.textContent = t.name + ' 已結束';
                    return;
                }

                cardEl.classList.remove('done');
                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.ceil(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);
                labelEl.textContent = t.name + ' 倒數 ' + days + ' 天';

                if (days >= 1 && days <= 5) {
                    cardEl.classList.add('urgent');
                } else {
                    cardEl.classList.remove('urgent');
                }
            });
        }

        // ============================================================
        // 4. 彈窗（Modal）與按鈕事件
        // ============================================================
        function showModal(examName, days, cheerText) {
            // 如果 days === 0（考試當天），顯示特別的提醒文字
            const reminderHtml = days === 0 
                ? '🎉 就是今天！全力以赴，Winny 加油！ 🎉' 
                : `⏰ 只剩 <strong>${days}</strong> 天，Winny 加油！`;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-icon">${examName.includes('筆試') ? '📖' : '🎤'}</div>
                    <img class="modal-gif" src="https://raw.githubusercontent.com/dustinchen26/test/refs/heads/master/pooh-pooh-and-piglet.gif" alt="小熊維尼與小豬" />
                    <h2>${examName} ${days === 0 ? '就是今天！' : '倒數 ' + days + ' 天'}</h2>
                    <div class="cheer-text">${cheerText}</div>
                    <div class="countdown-reminder">${reminderHtml}</div>
                    <button class="modal-close-btn" id="modalCloseBtn">我會全力以赴！</button>
                </div>
            `;
            document.body.appendChild(overlay);

            const closeModal = () => {
                overlay.remove();
            };

            const closeBtn = overlay.querySelector('#modalCloseBtn');
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal();
            });
        }

        // ============================================================
        // 5. 初始化
        // ============================================================
        function init() {
            // 每日小語
            document.getElementById('cheerMessage').textContent = getTodayCheer();

            // 倒數更新（每秒）
            updateCountdown();
            setInterval(updateCountdown, 1000);

            // 每日午夜更新小語
            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                if (now.toDateString() !== lastDateStr) {
                    lastDateStr = now.toDateString();
                    document.getElementById('cheerMessage').textContent = getTodayCheer();
                }
            }, 60000);

            // ★★★ 修改點：彈窗觸發條件改為「考前 0~5 天」（包含考試當天）★★★
            const now = new Date();
            const urgentExams = targets.filter(t => {
                const diff = t.date - now;
                const days = Math.ceil(diff / 86400000);
                // 包含今天 (days === 0) 到 5 天前 (days === 5)
                return days >= 0 && days <= 5;
            });

            if (urgentExams.length > 0) {
                urgentExams.sort((a, b) => {
                    const da = Math.ceil((a.date - now) / 86400000);
                    const db = Math.ceil((b.date - now) / 86400000);
                    return da - db;
                });
                const exam = urgentExams[0];
                const days = Math.ceil((exam.date - now) / 86400000);
                const pureMsg = getTodayCheer().replace(/（民國.*）/, '').trim();
                setTimeout(() => {
                    showModal(exam.name, days, pureMsg);
                }, 400);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
