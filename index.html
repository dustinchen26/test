<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>💕 Winny 加油！專屬倒數計時 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fce4ec 0%, #f3e5f5 40%, #e8dff5 70%, #fce4ec 100%);
            background-size: 300% 300%;
            animation: gradientFlow 12s ease-in-out infinite alternate;
            padding: 4px;
            position: relative;
            overflow: hidden;
            line-height: 1.4;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 花瓣 Canvas (平時) ===== */
        #petalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            display: block;
        }

        /* ===== 愛心雨 Canvas (七夕專屬) ===== */
        #heartRainCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            display: none;
        }
        #heartRainCanvas.active {
            display: block;
        }

        /* ===== 背景浮動愛心 ===== */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .bg-hearts span {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.06;
            animation: floatHeart 20s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) { top: 8%; left: 5%; animation-duration: 18s; }
        .bg-hearts span:nth-child(2) { top: 20%; right: 8%; animation-duration: 22s; animation-delay: 2s; }
        .bg-hearts span:nth-child(3) { bottom: 25%; left: 3%; animation-duration: 24s; animation-delay: 4s; }
        .bg-hearts span:nth-child(4) { bottom: 10%; right: 5%; animation-duration: 16s; animation-delay: 1s; }
        .bg-hearts span:nth-child(5) { top: 40%; left: 45%; animation-duration: 20s; animation-delay: 3s; font-size: 2rem; }
        .bg-hearts span:nth-child(6) { top: 55%; left: 15%; animation-duration: 26s; animation-delay: 5s; font-size: 1.2rem; }
        .bg-hearts span:nth-child(7) { top: 12%; left: 50%; animation-duration: 19s; animation-delay: 6s; font-size: 1.6rem; }
        @keyframes floatHeart {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-18px) rotate(6deg) scale(1.05); }
        }

        /* ===== 主容器 (手機版舒適行距) ===== */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 14px 16px 16px;
            box-shadow: 0 6px 24px rgba(156, 39, 176, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-height: 98vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        /* --- 標題區 --- */
        .header {
            text-align: center;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #4a148c;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }
        .header h1 .heart {
            color: #e91e63;
            display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .header .sub {
            font-size: 0.7rem;
            color: #7b4b8a;
            font-weight: 400;
            margin-top: 0;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        /* --- 分隔線 --- */
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 4px 0 8px;
            flex-shrink: 0;
        }
        .divider .line {
            width: 20px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #e91e63);
            border-radius: 2px;
        }
        .divider .line:last-child {
            background: linear-gradient(90deg, #e91e63, transparent);
        }
        .divider .dot {
            color: #e91e63;
            font-size: 0.55rem;
        }

        /* --- 倒數卡片 --- */
        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            padding: 8px 6px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 1px 6px rgba(156, 39, 176, 0.03);
            transition: transform 0.15s ease;
        }
        .card:active { transform: scale(0.97); }
        .card.urgent {
            border: 1.5px solid #ff4081;
            box-shadow: 0 0 12px rgba(255, 64, 129, 0.12);
            animation: softGlow 1.5s infinite alternate;
        }
        @keyframes softGlow {
            0% { box-shadow: 0 0 6px rgba(255, 64, 129, 0.08); }
            100% { box-shadow: 0 0 16px rgba(255, 64, 129, 0.18); }
        }
        .card.qixi {
            background: linear-gradient(135deg, #ffdde1, #fad0c4, #fbc2eb) !important;
            border: 1.5px solid #ff6b81 !important;
            box-shadow: 0 0 18px rgba(255, 107, 129, 0.2) !important;
            animation: qixiGlow 0.8s ease-in-out infinite alternate !important;
        }
        @keyframes qixiGlow {
            0% { box-shadow: 0 0 10px rgba(255, 107, 129, 0.15); }
            100% { box-shadow: 0 0 28px rgba(255, 107, 129, 0.35); }
        }
        .card.qixi .num {
            color: #d63031 !important;
            background: rgba(214, 48, 49, 0.06) !important;
        }
        .card.qixi .num.days {
            color: #e17055 !important;
            background: rgba(225, 112, 85, 0.08) !important;
        }
        .card.qixi .exam-name { color: #6c2a3e !important; }
        .card.qixi .countdown-label { color: #6c2a3e !important; }
        .card.qixi .exam-date .roc { color: #6c2a3e !important; }

        .card .exam-name {
            font-size: 0.7rem;
            font-weight: 700;
            color: #4a148c;
            letter-spacing: 0.3px;
            line-height: 1.2;
        }
        .card .exam-date {
            font-size: 0.55rem;
            color: #7b4b8a;
            margin: 0 0 2px;
            line-height: 1.1;
        }
        .card .exam-date .roc {
            font-weight: 500;
            color: #6a1b9a;
        }
        .card .countdown-label {
            font-size: 0.55rem;
            font-weight: 600;
            color: #c2185b;
            margin-bottom: 2px;
            line-height: 1.1;
        }
        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 2px;
            flex-wrap: nowrap;
        }
        .countdown-display .time-block {
            display: inline-flex;
            align-items: baseline;
            gap: 0px;
        }
        .countdown-display .num {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #4a148c;
            min-width: 18px;
            text-align: center;
            background: rgba(233, 30, 99, 0.03);
            border-radius: 3px;
            padding: 0 2px;
            line-height: 1.2;
        }
        .countdown-display .num.days {
            font-size: 1.5rem;
            color: #c2185b;
            min-width: 26px;
            background: rgba(233, 30, 99, 0.05);
        }
        .countdown-display .label {
            font-size: 0.45rem;
            font-weight: 400;
            color: #7b4b8a;
            margin-right: 0px;
        }
        .card.done {
            opacity: 0.4;
        }
        .card.done .num {
            color: #9e9e9e !important;
            background: rgba(0, 0, 0, 0.02) !important;
        }
        .card.done .exam-name {
            color: #9e9e9e;
        }

        /* --- 應援訊息 --- */
        .cheer-section {
            margin-top: 4px;
            padding-top: 6px;
            border-top: 1.5px dashed rgba(233, 30, 99, 0.10);
            text-align: center;
            flex-shrink: 0;
        }
        .cheer-message {
            font-size: 0.7rem;
            font-weight: 600;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.35);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.4);
            line-height: 1.4;
        }
        .cheer-message.qixi {
            background: rgba(255, 107, 129, 0.12);
            border-color: #ff6b81;
            color: #c0392b;
            box-shadow: 0 0 14px rgba(255, 107, 129, 0.10);
            font-size: 0.75rem;
            padding: 6px 14px;
        }

        /* --- 維尼專區 --- */
        .pooh-container {
            text-align: center;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1.5px dashed rgba(233, 30, 99, 0.10);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .pooh-container img {
            max-width: 56px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 1px 8px rgba(233, 30, 99, 0.06);
        }
        .pooh-container .pooh-text {
            font-size: 0.6rem;
            color: #4a148c;
            font-weight: 600;
            line-height: 1.2;
        }

        /* --- 頁尾 --- */
        .footer-note {
            margin-top: 4px;
            font-size: 0.5rem;
            color: #b39ddb;
            text-align: center;
            border-top: 1px solid rgba(233, 30, 99, 0.06);
            padding-top: 4px;
            padding-bottom: 1px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            line-height: 1.2;
        }
        .footer-note span {
            color: #e91e63;
            font-weight: 600;
        }

        /* --- 大熊 (手機版) --- */
        #bigBear {
            position: fixed;
            bottom: 5%;
            left: -15%;
            font-size: 32px;
            z-index: 9999;
            pointer-events: none;
            line-height: 1;
            transform-origin: center bottom;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #bigBear.active {
            opacity: 0.7;
            animation: bearWalk 7s ease-in-out infinite;
        }
        @keyframes bearWalk {
            0% { transform: translateX(-10vw) scale(0.2); opacity: 0.5; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateX(100vw) scale(1.8); opacity: 0.3; }
        }

        /* --- 煙火 --- */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
            display: none;
        }
        #fireworksCanvas.active {
            display: block;
        }

        /* ================================================================
                   ★★★ 彈窗 (維尼獨立一行，上下留白) ★★★
                   ================================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-box {
            background: white;
            border-radius: 22px;
            padding: 18px 18px 16px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 16px 32px rgba(233, 30, 99, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .modal-box .modal-icon {
            font-size: 2rem;
            margin-bottom: 2px;
        }
        /* ★★★ 維尼獨立一行 + 上下留白 ★★★ */
        .modal-box .modal-gif {
            display: block;
            margin: 8px auto 12px;
            max-width: 120px;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .modal-box h2 {
            font-size: 1.0rem;
            color: #4a148c;
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .modal-box .cheer-text {
            font-size: 0.85rem;
            color: #4a148c;
            line-height: 1.5;
            font-weight: 600;
        }
        .modal-box .countdown-reminder {
            font-size: 0.7rem;
            color: #c2185b;
            font-weight: 700;
            background: rgba(233, 30, 99, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin: 4px 0 8px;
        }
        .modal-close-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 6px 22px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 3px 10px rgba(233, 30, 99, 0.2);
        }
        .modal-close-btn:active {
            transform: scale(0.95);
        }

        /* ================================================================
                   ★★★ 電腦版自動放大 (寬度 > 600px) ★★★
                   ================================================================ */
        @media (min-width: 600px) {
            body { padding: 16px; }
            .container {
                max-width: 780px;
                padding: 30px 40px 34px;
                border-radius: 36px;
                max-height: 96vh;
                box-shadow: 0 12px 40px rgba(156, 39, 176, 0.08);
            }
            .header h1 { font-size: 2.0rem; letter-spacing: 0.5px; }
            .header .sub { font-size: 1.0rem; letter-spacing: 1px; }
            .divider { gap: 12px; margin: 8px 0 14px; }
            .divider .line { width: 50px; height: 2px; }
            .divider .dot { font-size: 1.0rem; }
            .countdown-grid { gap: 16px; margin-bottom: 12px; }
            .card { padding: 16px 12px 18px; border-radius: 20px; }
            .card .exam-name { font-size: 1.05rem; letter-spacing: 0.5px; }
            .card .exam-date { font-size: 0.8rem; margin: 0 0 4px; }
            .card .countdown-label { font-size: 0.85rem; margin-bottom: 4px; }
            .countdown-display { gap: 4px; }
            .countdown-display .num { font-size: 2.0rem; min-width: 32px; padding: 0 4px; border-radius: 6px; }
            .countdown-display .num.days { font-size: 2.6rem; min-width: 52px; }
            .countdown-display .label { font-size: 0.75rem; margin-right: 2px; }
            .cheer-section { margin-top: 8px; padding-top: 12px; border-top: 2px dashed rgba(233, 30, 99, 0.10); }
            .cheer-message { font-size: 1.05rem; padding: 10px 24px; border-radius: 40px; line-height: 1.6; }
            .cheer-message.qixi { font-size: 1.1rem; padding: 12px 28px; }
            .pooh-container { margin-top: 12px; padding-top: 12px; border-top: 2px dashed rgba(233, 30, 99, 0.10); gap: 14px; }
            .pooh-container img { max-width: 150px; border-radius: 12px; }
            .pooh-container .pooh-text { font-size: 0.95rem; }
            .footer-note { margin-top: 10px; font-size: 0.8rem; padding-top: 10px; border-top: 1.5px solid rgba(233, 30, 99, 0.06); letter-spacing: 0.5px; }
            #bigBear { bottom: 8%; font-size: 70px; }
            @keyframes bearWalk {
                0% { transform: translateX(-10vw) scale(0.3); opacity: 0.5; }
                15% { opacity: 0.9; }
                85% { opacity: 0.9; }
                100% { transform: translateX(110vw) scale(2.2); opacity: 0.3; }
            }
            /* ★ 電腦版彈窗維尼獨立一行 + 原始大小 ★ */
            .modal-box { max-width: 440px; padding: 30px 36px 26px; border-radius: 32px; }
            .modal-box .modal-icon { font-size: 3.0rem; }
            .modal-box .modal-gif { max-width: 160px; margin: 10px auto 16px; }
            .modal-box h2 { font-size: 1.4rem; }
            .modal-box .cheer-text { font-size: 1.05rem; line-height: 1.6; }
            .modal-box .countdown-reminder { font-size: 0.9rem; padding: 6px 18px; }
            .modal-close-btn { font-size: 1.0rem; padding: 10px 36px; }
        }

        /* ===== 極小螢幕微調 ===== */
        @media (max-width: 380px) {
            .container { padding: 10px 10px 12px; border-radius: 18px; }
            .header h1 { font-size: 0.95rem; }
            .header .sub { font-size: 0.55rem; }
            .card .exam-name { font-size: 0.6rem; }
            .card .exam-date { font-size: 0.45rem; }
            .card .countdown-label { font-size: 0.45rem; }
            .countdown-display .num { font-size: 1.0rem; min-width: 14px; }
            .countdown-display .num.days { font-size: 1.2rem; min-width: 20px; }
            .countdown-display .label { font-size: 0.35rem; }
            .cheer-message { font-size: 0.6rem; padding: 4px 8px; }
            .cheer-message.qixi { font-size: 0.65rem; padding: 4px 10px; }
            .pooh-container img { max-width: 40px; }
            .pooh-container .pooh-text { font-size: 0.5rem; }
            .modal-box .modal-gif { max-width: 90px; }
            .footer-note { font-size: 0.4rem; padding-top: 3px; }
            .countdown-grid { gap: 4px; }
            .card { padding: 4px 3px 5px; border-radius: 10px; }
        }

        /* ===== 高度不足時 (小手機) ===== */
        @media (max-height: 700px) and (max-width: 599px) {
            .container { padding: 8px 12px 10px; border-radius: 18px; }
            .header h1 { font-size: 0.95rem; }
            .header .sub { font-size: 0.55rem; }
            .divider { margin: 2px 0 6px; }
            .countdown-grid { gap: 4px; }
            .card { padding: 4px 3px 5px; border-radius: 10px; }
            .card .exam-name { font-size: 0.6rem; }
            .card .exam-date { font-size: 0.45rem; margin: 0 0 1px; }
            .card .countdown-label { font-size: 0.45rem; margin-bottom: 0px; }
            .countdown-display .num { font-size: 1.0rem; min-width: 14px; }
            .countdown-display .num.days { font-size: 1.2rem; min-width: 20px; }
            .countdown-display .label { font-size: 0.35rem; }
            .cheer-section { margin-top: 2px; padding-top: 4px; }
            .cheer-message { font-size: 0.6rem; padding: 4px 8px; }
            .cheer-message.qixi { font-size: 0.65rem; padding: 4px 10px; }
            .pooh-container { margin-top: 4px; padding-top: 4px; gap: 4px; }
            .pooh-container img { max-width: 40px; }
            .pooh-container .pooh-text { font-size: 0.5rem; }
            .modal-box .modal-gif { max-width: 90px; }
            .footer-note { font-size: 0.4rem; padding-top: 2px; margin-top: 2px; }
        }
    </style>
</head>
<body>

    <!-- 花瓣 Canvas (平時) -->
    <canvas id="petalCanvas"></canvas>
    <!-- 愛心雨 Canvas (七夕) -->
    <canvas id="heartRainCanvas"></canvas>

    <!-- 背景浮動愛心 -->
    <div class="bg-hearts">
        <span>💕</span><span>🌸</span><span>✨</span><span>💖</span><span>💗</span><span>🌷</span><span>🦋</span>
    </div>

    <!-- 大熊 -->
    <div id="bigBear" class="active">🐻</div>

    <!-- 煙火 Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div class="header">
            <h1><span class="heart">💕</span> Winny 加油！專屬倒數 <span class="heart">💕</span></h1>
            <div class="sub" id="subText">每天都為你打氣，開心迎接挑戰 ✨</div>
        </div>

        <div class="divider">
            <span class="line"></span>
            <span class="dot">❤️</span>
            <span class="line"></span>
        </div>

        <div class="countdown-grid" id="countdownGrid">
            <div class="card" id="card1">
                <div class="exam-name">📖 內科筆試</div>
                <div class="exam-date">民國 <span class="roc">115/08/15</span></div>
                <div class="countdown-label" id="label1">倒數 -- 天</div>
                <div class="countdown-display" id="countdown1">
                    <span class="time-block"><span class="num days" id="d1">--</span><span class="label">天</span></span>
                    <span class="time-block"><span class="num" id="h1">--</span><span class="label">時</span></span>
                    <span class="time-block"><span class="num" id="m1">--</span><span class="label">分</span></span>
                    <span class="time-block"><span class="num" id="s1">--</span><span class="label">秒</span></span>
                </div>
            </div>

        // ----- 花瓣 -----
        const petalCanvas = document.getElementById('petalCanvas');
        const pCtx = petalCanvas.getContext('2d');
        let petals = [];
        let pAnimationId = null;

        function resizePetalCanvas() {
            petalCanvas.width = window.innerWidth;
            petalCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizePetalCanvas);
        resizePetalCanvas();

        class Petal {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * petalCanvas.width;
                this.y = init ? Math.random() * petalCanvas.height : -20 - Math.random() * 40;
                this.size = 6 + Math.random() * 12;
                this.speedY = 0.4 + Math.random() * 0.8;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.wobble = Math.random() * 0.03;
                this.wobbleSpeed = 0.005 + Math.random() * 0.01;
                this.phase = Math.random() * Math.PI * 2;
                this.alpha = 0.5 + Math.random() * 0.4;
                const colors = ['rgba(244, 143, 177, ', 'rgba(233, 30, 99, ', 'rgba(255, 182, 193, ', 'rgba(240, 98, 146, ',
                    'rgba(255, 105, 180, '
                ];
                this.colorBase = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.phase) * this.wobble;
                this.phase += this.wobbleSpeed;
                this.rotation += this.rotSpeed;
                if (this.x < 0) this.x = petalCanvas.width;
                if (this.x > petalCanvas.width) this.x = 0;
                if (this.y > petalCanvas.height + 30) this.reset(false);
            }
            draw() {
                pCtx.save();
                pCtx.globalAlpha = this.alpha;
                pCtx.translate(this.x, this.y);
                pCtx.rotate(this.rotation);
                const s = this.size;
                pCtx.beginPath();
                pCtx.ellipse(0, 0, s * 0.6, s * 0.4, 0, 0, Math.PI * 2);
                pCtx.fillStyle = this.colorBase + this.alpha + ')';
                pCtx.fill();
                pCtx.restore();
            }
        }

        function initPetals(count = 45) {
            petals = [];
            for (let i = 0; i < count; i++) petals.push(new Petal());
        }

        function animatePetals() {
            pCtx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
            petals.forEach(p => { p.update(); p.draw(); });
            pAnimationId = requestAnimationFrame(animatePetals);
        }

        function startPetals() {
            if (pAnimationId) return;
            initPetals(45);
            animatePetals();
            petalCanvas.style.display = 'block';
        }

        function stopPetals() {
            if (pAnimationId) { cancelAnimationFrame(pAnimationId); pAnimationId = null; }
            pCtx.clearRect(0, 0, petalCanvas.width, petalCanvas.height);
            petalCanvas.style.display = 'none';

        // ----- 愛心雨 (七夕) 速度調慢、數量減少 -----
        const heartCanvas = document.getElementById('heartRainCanvas');

        let hearts = [];
        let hAnimationId = null;

        function resizeHeartCanvas() {
            heartCanvas.width = window.innerWidth;
            heartCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeHeartCanvas);
        resizeHeartCanvas();

        const HEART_SPEED_MULTIPLIER = 1.2;

        class Heart {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * heartCanvas.width;
                this.y = init ? Math.random() * heartCanvas.height : -20 - Math.random() * 60;
                this.size = 18 + Math.random() * 30;
                this.speedY = (0.8 + Math.random() * 1.2) * HEART_SPEED_MULTIPLIER;
                this.speedX = (Math.random() - 0.5) * 1.0 * HEART_SPEED_MULTIPLIER;
                this.rotSpeed = (Math.random() - 0.5) * 0.08 * HEART_SPEED_MULTIPLIER;
                this.scale = 0.8 + Math.random() * 0.6;
                this.scaleSpeed = (0.015 + Math.random() * 0.025) * HEART_SPEED_MULTIPLIER;
                this.scalePhase = Math.random() * Math.PI * 2;
                this.wobble = 0.02 + Math.random() * 0.04;
                this.wobbleSpeed = 0.008 + Math.random() * 0.018;
                this.phase = Math.random() * Math.PI * 2;
                this.alphaBase = 0.6 + Math.random() * 0.4;
                this.alphaSpeed = (0.004 + Math.random() * 0.01) * HEART_SPEED_MULTIPLIER;
                this.alphaPhase = Math.random() * Math.PI * 2;
                const colors = ['#e91e63', '#ff4081', '#f06292', '#ec407a', '#d81b60', '#c2185b', '#ad1457', '#880e4f',
                    '#ff6b6b', '#ff4757', '#ff2d55', '#ff3b30'
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.glow = Math.random() > 0.6;
                this.rotation = 0;
                this.currentScale = 1;
                this.currentAlpha = 1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.phase) * this.wobble;
                this.phase += this.wobbleSpeed;
                this.rotation += this.rotSpeed;
                this.scalePhase += this.scaleSpeed;
                this.currentScale = this.scale * (1 + 0.25 * Math.sin(this.scalePhase));
                this.alphaPhase += this.alphaSpeed;
                this.currentAlpha = this.alphaBase * (0.6 + 0.4 * Math.sin(this.alphaPhase));
                if (this.x < -50) this.x = heartCanvas.width + 50;
                if (this.x > heartCanvas.width + 50) this.x = -50;
                if (this.y > heartCanvas.height + 60) this.reset(false);
            }
            draw() {
                hCtx.save();
                hCtx.globalAlpha = Math.max(0, Math.min(1, this.currentAlpha));
                hCtx.translate(this.x, this.y);
                hCtx.rotate(this.rotation);
                hCtx.scale(this.currentScale, this.currentScale);
                if (this.glow) {
                    hCtx.shadowColor = this.color;
                    hCtx.shadowBlur = 20;
                }
                hCtx.font = this.size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
                hCtx.textAlign = 'center';
                hCtx.textBaseline = 'middle';
                hCtx.fillStyle = this.color;
                hCtx.fillText('❤️', 0, 0);
                hCtx.restore();
            }
        }

        function initHearts(count = 45) {
            hearts = [];

        function animateHearts() {

        // ============================================================
        // 4. 倒數 & 煙火
        // ============================================================
        function padZero(n) { return String(n).padStart(2, '0'); }

        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let fireworksActive = false;
        let particles = [];
        let fAnimationId = null;

        function resizeFireworksCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFireworksCanvas);
        resizeFireworksCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 - 2 };
                this.alpha = 1;
                this.decay = 0.008 + Math.random() * 0.018;
                this.size = 2 + Math.random() * 4;
                this.gravity = 0.05;
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bb5', '#f9ca24', '#ff9ff3', '#ff4757', '#2ed573'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 45 + Math.floor(Math.random() * 35);
            for (let i = 0; i < count; i++) {
                particles.push(new FireworkParticle(x, y, color));
            }
        }

        function animateFireworks() {
            if (!fireworksActive) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.12) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.6 + 20;
                createExplosion(x, y);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            fAnimationId = requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            if (fireworksActive) return;
            fireworksActive = true;
            canvas.classList.add('active');
            particles = [];
            if (fAnimationId) cancelAnimationFrame(fAnimationId);
            animateFireworks();
        }

        function stopFireworks() {
            fireworksActive = false;
            canvas.classList.remove('active');
            if (fAnimationId) { cancelAnimationFrame(fAnimationId); fAnimationId = null; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        function isInFireworksWindow(targetDate) {
            const now = new Date();
            const diffMs = targetDate - now;
            const days = Math.ceil(diffMs / 86400000);
            return days >= 0 && days <= 3;
        }

        function shouldFireworksBeActive() {
            const now = new Date();
            for (const t of targets) {
                const diffMs = t.date - now;
                const days = Math.ceil(diffMs / 86400000);
                if (days >= 0 && days <= 3) return true;
            }
            return false;
        }

        function updateCountdown() {
            const now = new Date();
            if (shouldFireworksBeActive()) startFireworks();
            else stopFireworks();

            const qixi = isQixi();
            targets.forEach(t => {
                const targetDate = t.date;
                const diffMs = targetDate - now;
                const isDone = diffMs <= 0;
                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const cardEl = document.getElementById(t.cardId);
                const labelEl = document.getElementById(t.labelId);
                if (!dEl || !cardEl) return;

                if (qixi) cardEl.classList.add('qixi');
                else cardEl.classList.remove('qixi');

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00';
                    mEl.textContent = '00';
                    sEl.textContent = '00';
                    cardEl.classList.add('done');
                    cardEl.classList.remove('urgent');
                    labelEl.textContent = t.name + ' ✅ 已完成';
                    return;
                }
                cardEl.classList.remove('done');
                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.ceil(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;
                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);
                labelEl.textContent = t.name + ' 倒數 ' + days + ' 天';
                if (days >= 1 && days <= 5) cardEl.classList.add('urgent');
                else cardEl.classList.remove('urgent');
            });
        }

                reminderHtml = '🌟 你已經完成了所有挑戰，超級厲害！ 🌟';
            } else if (days === 0) {
                iconEmoji = emoji || '🎯';
                titleText = examName + ' 就是今天！';
                reminderHtml = '🎉 就是今天！全力以赴，Winny 加油！ 🎉';
            } else if (days > 0) {
                iconEmoji = emoji || '📚';
                titleText = examName + ' 倒數 ' + days + ' 天';
                reminderHtml = '⏰ 只剩 <strong>' + days + '</strong> 天，Winny 加油！ 💪';
            } else {
                iconEmoji = '✅';
                titleText = examName + ' 已結束！';
                reminderHtml = '🎉 你已經完成了 ' + examName + '，表現超級棒！ 🎉';
            }

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-icon">${iconEmoji}</div>
                    <!-- 維尼獨立一行 (CSS 已設定 display:block + margin) -->
                    <img class="modal-gif" src="https://raw.githubusercontent.com/dustinchen26/test/refs/heads/master/pooh-pooh-and-piglet.gif" alt="小熊維尼與小豬" />
                    <h2>${titleText}</h2>
                    <div class="cheer-text">${cheerText}</div>
                    <div class="countdown-reminder">${reminderHtml}</div>
                    <button class="modal-close-btn" id="modalCloseBtn">${qixi ? '💕 我也愛你 💕' : '💪 我會全力以赴！'}</button>
                </div>
            `;
            document.body.appendChild(overlay);
            const closeModal = () => { overlay.remove(); };
            overlay.querySelector('#modalCloseBtn').addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
        }

        // ============================================================
        // 6. 初始化
        // ============================================================
        function init() {
            const qixi = isQixi();

            if (qixi) {
                stopPetals();
                startHeartRain();
            } else {
                stopHeartRain();
                startPetals();
            }

            const cheerEl = document.getElementById('cheerMessage');
            cheerEl.textContent = getTodayCheer();
            if (qixi) {
                cheerEl.classList.add('qixi');
                document.getElementById('subText').textContent = '💖 七夕快樂，我的寶貝';
            } else {
                cheerEl.classList.remove('qixi');
                document.getElementById('subText').textContent = '每天都為你打氣，開心迎接挑戰 ✨';
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);

            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                if (now.toDateString() !== lastDateStr) {
                    lastDateStr = now.toDateString();
                    const newMsg = getTodayCheer();
                    document.getElementById('cheerMessage').textContent = newMsg;
                    const isQixiNow = isQixi();
                    if (isQixiNow) {
                        document.getElementById('cheerMessage').classList.add('qixi');
                        document.getElementById('subText').textContent = '💖 七夕快樂，我的寶貝';
                        stopPetals();
                        startHeartRain();
                    } else {
                        document.getElementById('cheerMessage').classList.remove('qixi');
                        document.getElementById('subText').textContent = '每天都為你打氣，開心迎接挑戰 ✨';
                        stopHeartRain();
                        startPetals();
                    }
                }
            }, 60000);

            const now = new Date();
            const upcomingExams = targets
                .map(t => {
                    const diff = t.date - now;
                    const days = Math.ceil(diff / 86400000);
                    return { ...t, diff, days };
                })
                .filter(e => e.days >= 0);

            const pureMsg = getTodayCheer().replace(/（民國.*）/, '').trim();

            setTimeout(() => {
                if (qixi) {
                    showModal('七夕', 0, pureMsg, false, '❤️', true);
                } else if (upcomingExams.length === 0) {
                    showModal('所有考試', 0, pureMsg, true, '🏆', false);
                } else {
                    const nearest = upcomingExams.reduce((a, b) => a.days < b.days ? a : b);
                    showModal(nearest.name, nearest.days, pureMsg, false, nearest.emoji, false);
                }
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
