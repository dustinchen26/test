<html lang="zh-TW">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        /* ----- 全局重置 & 背景（乾淨柔和） ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fce4ec 0%, #f3e5f5 100%);
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* 背景輕柔浮動愛心（點綴，不搶眼） */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-hearts span {
            position: absolute;
            font-size: 2.4rem;
            opacity: 0.10;
            animation: floatHeart 20s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) { top: 10%; left: 8%; animation-duration: 18s; }
        .bg-hearts span:nth-child(2) { top: 25%; right: 12%; animation-duration: 22s; animation-delay: 2s; }
        .bg-hearts span:nth-child(3) { bottom: 30%; left: 5%; animation-duration: 24s; animation-delay: 4s; }
        .bg-hearts span:nth-child(4) { bottom: 15%; right: 8%; animation-duration: 16s; animation-delay: 1s; }
        .bg-hearts span:nth-child(5) { top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 28s; font-size: 6rem; opacity: 0.05; }

        @keyframes floatHeart {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(6deg); }
        }

        /* ----- 主容器（乾淨玻璃質感） ----- */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 44px;
            padding: 30px 28px 32px;
            box-shadow: 0 20px 50px rgba(156, 39, 176, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }
        .header h1 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2.0rem;
            color: #4a148c;
            letter-spacing: 1px;
        }
        .header h1 .heart {
            color: #e91e63;
            display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        .header .sub {
            font-size: 0.95rem;
            color: #7b4b8a;
            font-weight: 300;
            margin-top: 2px;
            letter-spacing: 2px;
        }

        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 8px 0 18px;
        }
        .divider .line {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63);
            border-radius: 2px;
        }
        .divider .line:last-child {
            background: linear-gradient(90deg, #e91e63, transparent);
        }
        .divider .dot { color: #e91e63; font-size: 0.9rem; }

        /* 倒數卡片 */
        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 18px 12px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 16px rgba(156, 39, 176, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(156, 39, 176, 0.08);
        }

        /* 考前兩天閃爍提醒（柔和） */
        .card.urgent {
            border: 2px solid #ff4081;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.15);
            animation: softGlow 1.5s infinite alternate;
        }
        @keyframes softGlow {
            0% { box-shadow: 0 0 10px rgba(255, 64, 129, 0.1); }
            100% { box-shadow: 0 0 30px rgba(255, 64, 129, 0.25); }
        }

        .card .exam-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a148c;
            letter-spacing: 1px;
        }
        .card .exam-date {
            font-size: 0.8rem;
            color: #7b4b8a;
            margin: 2px 0 6px;
        }
        .card .exam-date .roc { font-weight: 500; color: #6a1b9a; }
        .card .countdown-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #c2185b;
            margin-bottom: 6px;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;
            flex-wrap: wrap;
        }
        .countdown-display .time-block {
            display: inline-flex;
            align-items: baseline;
            gap: 2px;
        }
        .countdown-display .num {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: #4a148c;
            min-width: 36px;
            text-align: center;
            background: rgba(233, 30, 99, 0.04);
            border-radius: 6px;
            padding: 0 4px;
            line-height: 1.2;
        }
        .countdown-display .num.days {
            font-size: 2.6rem;
            color: #c2185b;
            min-width: 48px;
            background: rgba(233, 30, 99, 0.06);
        }
        .countdown-display .label {
            font-size: 0.7rem;
            font-weight: 400;
            color: #7b4b8a;
            margin-right: 2px;
        }

        .card.done {
            opacity: 0.6;
        }
        .card.done .num {
            color: #9e9e9e !important;
            background: rgba(0, 0, 0, 0.03) !important;
        }

        /* 應援訊息 */
        .cheer-section {
            margin-top: 6px;
            padding-top: 16px;
            border-top: 2px dashed rgba(233, 30, 99, 0.12);
            text-align: center;
        }
        .cheer-message {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 22px;
            border-radius: 40px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.5);
            line-height: 1.6;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #b39ddb;
            text-align: center;
            border-top: 1px solid rgba(233, 30, 99, 0.08);
            padding-top: 14px;
            letter-spacing: 1px;
        }
        .footer-note span { color: #e91e63; font-weight: 600; }

        /* ----- ★ 主角：大熊 Emoji 由左往右逐漸放大 ★ ----- */
        #bigBear {
            position: fixed;
            bottom: 15%;
            left: -20%;
            font-size: 60px;
            z-index: 9999;
            pointer-events: none;
            line-height: 1;
            transform-origin: center bottom;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #bigBear.active {
            opacity: 1;
            animation: bearWalk 6s ease-in-out infinite;
        }

        @keyframes bearWalk {
            0% {
                transform: translateX(-10vw) scale(0.4);
                opacity: 0.6;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateX(100vw) scale(2.8);
                opacity: 0.4;
            }
        }

        /* 響應式調整 */
        @media (max-width: 680px) {
            .container { padding: 20px 16px; border-radius: 28px; }
            .header h1 { font-size: 1.5rem; }
            .countdown-grid { grid-template-columns: 1fr; gap: 12px; }
            .countdown-display .num { font-size: 1.8rem; min-width: 28px; }
            .countdown-display .num.days { font-size: 2.2rem; min-width: 38px; }
            .cheer-message { font-size: 0.95rem; padding: 8px 16px; }
            #bigBear { bottom: 10%; font-size: 40px; }
            @keyframes bearWalk {
                0% { transform: translateX(-10vw) scale(0.3); opacity: 0.6; }
                100% { transform: translateX(100vw) scale(2.0); opacity: 0.4; }
            }
        }
        @media (max-width: 400px) {
            .container { padding: 12px 10px; border-radius: 20px; }
            .header h1 { font-size: 1.2rem; }
            .countdown-display .num { font-size: 1.4rem; min-width: 22px; }
            .countdown-display .num.days { font-size: 1.8rem; min-width: 30px; }
            #bigBear { bottom: 8%; font-size: 30px; }
            @keyframes bearWalk {
                0% { transform: translateX(-10vw) scale(0.2); opacity: 0.6; }
                100% { transform: translateX(100vw) scale(1.8); opacity: 0.4; }
            }
        }

        /* ===== 彈窗（含小熊維尼 GIF） ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }

        .modal-box {
            background: white;
            border-radius: 32px;
            padding: 28px 32px 24px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(233, 30, 99, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .modal-box .modal-icon {
            font-size: 3rem;
            margin-bottom: 4px;
        }
        .modal-box .modal-gif {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 16px;
            margin: 8px auto 12px;
            display: block;
        }
        .modal-box h2 {
            font-size: 1.4rem;
            color: #4a148c;
            margin-bottom: 8px;
        }
        .modal-box .cheer-text {
            font-size: 1.1rem;
            color: #4a148c;
            line-height: 1.6;
            font-weight: 600;

            background: rgba(233, 30, 99, 0.06);

            border-radius: 30px;
            display: inline-block;

            color: white;
            border: none;
            padding: 10px 36px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;

        .pooh-container.show {

            max-width: 180px;
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.1);
        }
        .pooh-container .pooh-text {
            font-size: 0.95rem;
            color: #4a148c;
            font-weight: 600;
            margin-top: 6px;
        }

            "你值得所有的掌聲 🌟", // 64: 9/11
            "保持信心，一切都在掌握中。", // 65: 9/12
            "今天的努力，明天會感謝你。", // 66: 9/13
            "放鬆心情，你已經準備得很好了！", // 67: 9/14
            "最後衝刺，全力以赴！", // 68: 9/15
            "你已經準備萬全，Winny 加油！", // 69: 9/16

            // ----- 口試前三天 + 口試當天：9/17 ~ 9/20 (索引 70~73) -----
            "🎤 倒數3天！展現自信，你已經很棒了！", // 70: 9/17
            "🎤 倒數2天！從容應對，展現最好的自己！", // 71: 9/18
            "🎤 倒數1天！放鬆心情，明天就是你的舞台！", // 72: 9/19
            "🎉 就是今天！全力以赴，我為你驕傲！" // 73: 9/20
        ];

        // 安全取得今日訊息（絕不返回 undefined）
        function getTodayCheer() {
            const now = new Date();
            const baseDate = new Date(2026, 6, 9); // 7月9日
            const diffDays = Math.floor((now - baseDate) / (1000 * 60 * 60 * 24));

            let message = '';
            if (diffDays >= 0 && diffDays < DAILY_MESSAGES.length) {
                message = DAILY_MESSAGES[diffDays];
            } else if (diffDays >= DAILY_MESSAGES.length) {
                message = "🎉 太棒了！所有挑戰都完成了，你超級厲害！🏆";
            } else {
                message = "💖 準備好了嗎？每一天都是新的開始，加油！";
            }

            // 補上日期（確保不為空）
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const rocYear = year - 1911;
            return message + ' （民國 ' + rocYear + '/' + month + '/' + day + '）';
        }

        // ============================================================
        // 3. 倒數更新 & 熊特效觸發
        // ============================================================
        const bearElement = document.getElementById('bigBear');
        let bearActive = false;

        function padZero(n) { return String(n).padStart(2, '0'); }

        function updateCountdown() {
            const now = new Date();
            let anyUrgent = false;
            let anyBear = false;

            targets.forEach(t => {
                const targetDate = t.date;
                const diffMs = targetDate - now;
                const isDone = diffMs <= 0;

                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const cardEl = document.getElementById(t.cardId);
                const labelEl = document.getElementById(t.labelId);

                if (!dEl || !cardEl) return;

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00';
                    mEl.textContent = '00';
                    sEl.textContent = '00';
                    cardEl.classList.add('done');
                    cardEl.classList.remove('urgent');
                    labelEl.textContent = t.name + ' 已結束';
                    return;
                }

                cardEl.classList.remove('done');
                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.ceil(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);
                labelEl.textContent = t.name + ' 倒數 ' + days + ' 天';

                // 考前5天內：卡片加微光
                if (days >= 1 && days <= 5) {
                    anyUrgent = true;
                    cardEl.classList.add('urgent');
                } else {
                    cardEl.classList.remove('urgent');
                }

                // 考前2天內：觸發熊特效
                if (days >= 1 && days <= 2) {
                    anyBear = true;
                }
            });

            // 控制熊特效
            if (anyBear) {
                if (!bearActive) {
                    bearActive = true;
                    bearElement.classList.add('active');
                }
            } else {
                if (bearActive) {
                    bearActive = false;
                    bearElement.classList.remove('active');
                }
            }
        }

        // ============================================================
        // 4. 彈窗（含小熊維尼 GIF）+ 點擊按鈕後顯示小熊維尼專區
        // ============================================================
        function showModal(examName, days, cheerText) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-icon">${examName.includes('筆試') ? '📖' : '🎤'}</div>
                    <img class="modal-gif" src="https://raw.githubusercontent.com/dustinchen26/test/refs/heads/master/pooh-pooh-and-piglet.gif" alt="小熊維尼與小豬" />
                    <h2>${examName} 倒數 ${days} 天</h2>
                    <div class="cheer-text">${cheerText}</div>
                    <div class="countdown-reminder">⏰ 只剩 <strong>${days}</strong> 天，Winny 加油！</div>
                    <button class="modal-close-btn" id="modalCloseBtn">我會全力以赴！</button>
                </div>
            `;
            document.body.appendChild(overlay);

            // 關閉彈窗 + 顯示小熊維尼專區
            const closeModal = () => {
                overlay.remove();
                // 顯示頁面上的小熊維尼專區
                const poohContainer = document.getElementById('poohContainer');
                if (poohContainer) {
                    poohContainer.classList.add('show');
                }
            };

            const closeBtn = overlay.querySelector('#modalCloseBtn');
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal();
            });
        }

        // ============================================================
        // 5. 初始化
        // ============================================================
        function init() {
            // 更新每日小語
            const cheerText = getTodayCheer();
            document.getElementById('cheerMessage').textContent = cheerText;

            // 更新倒數（每秒）
            updateCountdown();
            setInterval(updateCountdown, 1000);

            // 每日午夜更新小語
            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                if (now.toDateString() !== lastDateStr) {
                    lastDateStr = now.toDateString();
                    document.getElementById('cheerMessage').textContent = getTodayCheer();
                }
            }, 60000);

            // 彈窗：考前5天內，優先顯示最近的考試
            const now = new Date();
            const urgentExams = targets.filter(t => {
                const diff = t.date - now;
                if (diff > 0) {
                    const days = Math.ceil(diff / 86400000);
                    return days >= 1 && days <= 5;
                }
                return false;
            });

            if (urgentExams.length > 0) {
                urgentExams.sort((a, b) => {
                    const da = Math.ceil((a.date - now) / 86400000);
                    const db = Math.ceil((b.date - now) / 86400000);
                    return da - db;
                });
                const exam = urgentExams[0];
                const days = Math.ceil((exam.date - now) / 86400000);
                const pureMsg = getTodayCheer().replace(/（民國.*）/, '').trim();
                setTimeout(() => {
                    showModal(exam.name, days, pureMsg);
                }, 400);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
