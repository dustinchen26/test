<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>💕 Winny 加油！專屬倒數計時 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fce4ec 0%, #f3e5f5 40%, #e8dff5 70%, #fce4ec 100%);
            background-size: 300% 300%;
            animation: gradientFlow 12s ease-in-out infinite alternate;
            padding: 10px 4px;
            position: relative;
            line-height: 1.5;
            overflow-x: hidden;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 情人節快樂!!!背景 */
        body.valentine-mode {
            background: linear-gradient(145deg,
                #ffe0ec 0%, #ffc9e0 15%, #f9c6ff 30%,
                #ffd6e8 45%, #ffc1d9 60%, #e9c7ff 75%,
                #ffd9ea 90%, #ffe0ec 100%);
            background-size: 500% 500%;
            animation: valentineFlow 9s ease-in-out infinite alternate;
        }
        @keyframes valentineFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas */
        #petalCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; display: block;
        }
        #heartRainCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; display: none;
        }
        #heartRainCanvas.active { display: block; }
        #valentineCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; display: none;
        }
        #valentineCanvas.active { display: block; }

        /* 背景浮動愛心（減少為 5 個，降低負擔） */
        .bg-hearts {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 1;
        }
        .bg-hearts span {
            position: absolute; font-size: 1.4rem; opacity: 0.06;
            animation: floatHeart 22s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) { top: 8%; left: 5%; animation-duration: 20s; }
        .bg-hearts span:nth-child(2) { top: 20%; right: 8%; animation-duration: 24s; animation-delay: 2s; }
        .bg-hearts span:nth-child(3) { bottom: 25%; left: 3%; animation-duration: 26s; animation-delay: 4s; }
        .bg-hearts span:nth-child(4) { bottom: 10%; right: 5%; animation-duration: 18s; animation-delay: 1s; }
        .bg-hearts span:nth-child(5) { top: 45%; left: 45%; animation-duration: 22s; animation-delay: 3s; font-size: 2rem; }
        @keyframes floatHeart {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-18px) rotate(6deg) scale(1.05); }
        }

        /* 主容器 */
        .container {
            position: relative; z-index: 2; width: 100%; max-width: 480px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 28px; padding: 16px 18px 18px;
            box-shadow: 0 8px 32px rgba(156, 39, 176, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin: auto; display: flex; flex-direction: column;
            transition: all 0.2s ease; flex-shrink: 0;
        }
        .container.valentine-mode {
            border: 2px solid transparent;
            background:
                linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)) padding-box,
                linear-gradient(120deg, #ff1744, #ff80ab, #ffd700, #ff4081, #d500f9, #ff1744) border-box;
            background-size: 100% 100%, 400% 400%;
            animation: rainbowBorder 5s linear infinite, valentinePulse 2.2s ease-in-out infinite alternate;
        }
        @keyframes rainbowBorder {
            0% { background-position: 0 0, 0% 50%; }
            100% { background-position: 0 0, 400% 50%; }
        }
        @keyframes valentinePulse {
            0% { box-shadow: 0 0 22px rgba(255, 23, 68, 0.22), 0 0 60px rgba(213, 0, 249, 0.12); }
            100% { box-shadow: 0 0 46px rgba(255, 23, 68, 0.45), 0 0 110px rgba(213, 0, 249, 0.30); }
        }

        /* 標題 */
        .header { text-align: center; margin-bottom: 6px; flex-shrink: 0; }
        .header h1 {
            font-family: 'Quicksand', sans-serif; font-weight: 700;
            font-size: 1.2rem; color: #4a148c; letter-spacing: 0.3px; line-height: 1.3;
        }
        .header h1 .heart {
            color: #e91e63; display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
        .header .sub {
            font-size: 0.8rem; color: #7b4b8a; font-weight: 500;
            margin-top: 1px; letter-spacing: 0.5px; line-height: 1.2;
        }

        /* 情人節快樂!!!橫幅 */
        .valentine-banner {
            display: none; margin: 6px auto 2px; padding: 5px 16px;
            border-radius: 999px; font-size: 0.72rem; font-weight: 900;
            color: #fff; letter-spacing: 1px;
            background: linear-gradient(90deg, #ff1744, #ff4081, #d500f9, #ff8a00, #ff1744);
            background-size: 300% 100%;
            animation: bannerFlow 3s linear infinite;
            box-shadow: 0 0 18px rgba(255, 23, 68, 0.5);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.22);
            width: fit-content; max-width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .valentine-banner.show { display: block; }
        @keyframes bannerFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* 分隔線 */
        .divider {
            display: flex; justify-content: center; align-items: center;
            gap: 6px; margin: 4px 0 8px; flex-shrink: 0;
        }
        .divider .line {
            width: 24px; height: 1.5px;
            background: linear-gradient(90deg, transparent, #e91e63);
            border-radius: 2px;
        }
        .divider .line:last-child {
            background: linear-gradient(90deg, #e91e63, transparent);
        }
        .divider .dot { color: #e91e63; font-size: 0.7rem; }

        /* 倒數卡片 */
        .countdown-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-bottom: 8px; flex-shrink: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.5); border-radius: 16px;
            padding: 10px 6px 12px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 8px rgba(156, 39, 176, 0.03);
            transition: transform 0.15s ease;
        }
        .card:active { transform: scale(0.97); }
        .card.urgent {
            border: 1.5px solid #ff4081;
            box-shadow: 0 0 14px rgba(255, 64, 129, 0.12);
            animation: softGlow 1.5s infinite alternate;
        }
        @keyframes softGlow {
            0% { box-shadow: 0 0 6px rgba(255, 64, 129, 0.08); }
            100% { box-shadow: 0 0 18px rgba(255, 64, 129, 0.18); }
        }
        .card.qixi {
            background: linear-gradient(135deg, #ffdde1, #fad0c4, #fbc2eb) !important;
            border: 1.5px solid #ff6b81 !important;
            box-shadow: 0 0 20px rgba(255, 107, 129, 0.2) !important;
            animation: qixiGlow 0.8s ease-in-out infinite alternate !important;
        }
        @keyframes qixiGlow {
            0% { box-shadow: 0 0 10px rgba(255, 107, 129, 0.15); }
            100% { box-shadow: 0 0 30px rgba(255, 107, 129, 0.35); }
        }
        .card.qixi .num { color: #d63031 !important; background: rgba(214, 48, 49, 0.06) !important; }
        .card.qixi .num.days { color: #e17055 !important; background: rgba(225, 112, 85, 0.08) !important; }
        .card.qixi .exam-name { color: #6c2a3e !important; }
        .card.qixi .countdown-label { color: #6c2a3e !important; }
        .card.qixi .exam-date .roc { color: #6c2a3e !important; }

        .card.valentine {
            background: linear-gradient(135deg, #fff0f6, #ffe1f0, #ffeaf8, #fff5fb) !important;
            border: 1.5px solid #ff4081 !important;
            box-shadow: 0 0 18px rgba(255, 64, 129, 0.25) !important;
            animation: cardShine 2s ease-in-out infinite alternate !important;
        }
        @keyframes cardShine {
            0% { box-shadow: 0 0 10px rgba(255, 64, 129, 0.16); }
            100% { box-shadow: 0 0 30px rgba(255, 64, 129, 0.42); }
        }
        .card.valentine .num { color: #d81b60 !important; background: rgba(216, 27, 96, 0.07) !important; }
        .card.valentine .num.days { color: #c2185b !important; background: rgba(194, 24, 91, 0.09) !important; }
        .card.valentine .exam-name { color: #ad1457 !important; }
        .card.valentine .countdown-label { color: #ad1457 !important; }
        .card.valentine .exam-date .roc { color: #8e24aa !important; }

        .card .exam-name { font-size: 0.75rem; font-weight: 700; color: #4a148c; letter-spacing: 0.3px; line-height: 1.2; }
        .card .exam-date { font-size: 0.55rem; color: #7b4b8a; margin: 0 0 2px; line-height: 1.1; }
        .card .exam-date .roc { font-weight: 500; color: #6a1b9a; }
        .card .countdown-label { font-size: 0.6rem; font-weight: 600; color: #c2185b; margin-bottom: 2px; line-height: 1.1; }
        .countdown-display { display: flex; justify-content: center; align-items: baseline; gap: 2px; flex-wrap: nowrap; }
        .countdown-display .time-block { display: inline-flex; align-items: baseline; gap: 0px; }
        .countdown-display .num {
            font-family: 'Quicksand', sans-serif; font-weight: 700;
            font-size: 1.1rem; color: #4a148c; min-width: 16px; text-align: center;
            background: rgba(233, 30, 99, 0.03); border-radius: 3px;
            padding: 0 2px; line-height: 1.2;
        }
        .countdown-display .num.days {
            font-size: 1.4rem; color: #c2185b; min-width: 24px;
            background: rgba(233, 30, 99, 0.05);
        }
        .countdown-display .label { font-size: 0.45rem; font-weight: 400; color: #7b4b8a; margin-right: 0px; }
        .card.done { opacity: 0.4; }
        .card.done .num { color: #9e9e9e !important; background: rgba(0, 0, 0, 0.02) !important; }
        .card.done .exam-name { color: #9e9e9e; }

        /* 9/14 專屬：鋼琴音樂 + 合照 */
        .photo-music-section {
            display: none; margin-top: 10px; padding-top: 10px;
            border-top: 1.5px dashed rgba(233, 30, 99, 0.10);
            text-align: center; flex-shrink: 0;
        }
        .photo-music-section.show { display: block; }

        /* 音樂浮動按鈕 */
        .music-float-btn {
            position: fixed; bottom: 24px; right: 18px; z-index: 9999;
            width: 56px; height: 56px; border-radius: 50%; border: none;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #fff;
            background: linear-gradient(135deg, #ff1744, #ff4081, #d500f9);
            background-size: 200% 200%;
            animation: musicBtnFlow 3s ease infinite, musicBtnPulse 1.8s ease-in-out infinite alternate;
            box-shadow: 0 6px 24px rgba(255, 23, 68, 0.45);
            transition: transform 0.2s ease, opacity 0.3s ease;
            opacity: 0; pointer-events: none;
        }
        .music-float-btn.show { opacity: 1; pointer-events: auto; }
        .music-float-btn:active { transform: scale(0.9); }
        .music-float-btn.playing {
            animation: musicBtnFlow 3s ease infinite, musicBtnSpin 4s linear infinite;
        }
        @keyframes musicBtnFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes musicBtnPulse {
            0% { box-shadow: 0 6px 24px rgba(255, 23, 68, 0.35); }
            100% { box-shadow: 0 6px 36px rgba(255, 23, 68, 0.65); }
        }
        @keyframes musicBtnSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 拍立得合照 */
        .polaroid-wrap {
            display: inline-block; background: #fff;
            padding: 10px 10px 40px; border-radius: 4px;
            box-shadow:
                0 4px 16px rgba(233, 30, 99, 0.18),
                0 1px 4px rgba(0, 0, 0, 0.08);
            transform: rotate(-2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 220px; margin: 4px auto 10px; position: relative;
        }
        .polaroid-wrap:hover {
            transform: rotate(0deg) scale(1.04);
            box-shadow:
                0 8px 28px rgba(233, 30, 99, 0.28),
                0 2px 8px rgba(0, 0, 0, 0.12);
        }
        .polaroid-wrap img {
            display: block; width: 100%; height: auto;
            border-radius: 2px; object-fit: cover;
        }
        .polaroid-wrap .polaroid-caption {
            position: absolute; bottom: 8px; left: 0; right: 0;
            text-align: center; font-size: 0.68rem; font-weight: 700;
            color: #ad1457; letter-spacing: 0.5px;
        }

        /* 音樂提示文字 */
        .music-hint {
            font-size: 0.6rem; color: #b39ddb; margin-top: 6px;
            letter-spacing: 0.3px;
        }
        .music-hint.show { display: block; }
        .music-hint.hide { display: none; }

        /* ★ 全螢幕點擊提示（自動播放失敗時顯示） */
        .tap-hint {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff1744, #ff4081, #d500f9);
            background-size: 200% 100%;
            animation: bannerFlow 2.5s linear infinite, tapHintPulse 1.6s ease-in-out infinite alternate;
            color: #fff; padding: 10px 22px; border-radius: 999px;
            font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(255, 23, 68, 0.45);
            z-index: 100000; pointer-events: none;
            opacity: 0; transition: opacity 0.3s ease;
            white-space: nowrap; max-width: 90vw;
            overflow: hidden; text-overflow: ellipsis;
        }
        .tap-hint.show { opacity: 1; }
        @keyframes tapHintPulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.05); }
        }

        /* 應援訊息 */
        .cheer-section {
            margin-top: 4px; padding-top: 8px;
            border-top: 1.5px dashed rgba(233, 30, 99, 0.10);
            text-align: center; flex-shrink: 0;
        }
        .cheer-message {
            font-size: 0.78rem; font-weight: 700; color: #7b4b8a;
            display: inline-block; line-height: 1.5; padding: 4px 4px;
            background: linear-gradient(to right, #e91e63 0%, #e91e63 50%, #7b4b8a 50%, #7b4b8a 100%);
            background-size: 200% 100%; background-position: 0% 0%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: karaoke 5s ease-in-out infinite;
        }
        @keyframes karaoke {
            0% { background-position: 100% 0%; }
            50% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }
        .cheer-message.qixi { font-weight: 700; animation-duration: 4s; }
        .cheer-message.valentine {
            font-weight: 900; letter-spacing: 0.4px;
            background: linear-gradient(to right,
                #ff1744 0%, #ff1744 48%,
                #ff8a00 48%, #ffd700 66%,
                #7b4b8a 66%, #7b4b8a 100%);
            background-size: 220% 100%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: karaoke 3.2s ease-in-out infinite;
        }

        /* 維尼 */
        .pooh-container {
            text-align: center; margin-top: 10px; padding-top: 10px;
            border-top: 1.5px dashed rgba(233, 30, 99, 0.10);
            flex-shrink: 0; display: block;
        }
        .pooh-container img {
            display: block; margin: 0 auto 8px;
            max-width: 130px; width: 100%; height: auto;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(233, 30, 99, 0.10);
            transition: transform 0.2s ease;
        }
        .pooh-container img:active { transform: scale(0.95); }
        .pooh-text {
            display: inline-block; font-size: 0.85rem; color: #4a148c;
            font-weight: 700; line-height: 1.4; letter-spacing: 0.5px;
            background: transparent; padding: 0; border: none;
            border-radius: 0; backdrop-filter: none; box-shadow: none;
        }
        .pooh-text .char { display: inline-block; animation: waveChar 2s ease-in-out infinite; }
        .pooh-text .char:nth-child(1) { animation-delay: 0.00s; }
        .pooh-text .char:nth-child(2) { animation-delay: 0.08s; }
        .pooh-text .char:nth-child(3) { animation-delay: 0.16s; }
        .pooh-text .char:nth-child(4) { animation-delay: 0.24s; }
        .pooh-text .char:nth-child(5) { animation-delay: 0.32s; }
        .pooh-text .char:nth-child(6) { animation-delay: 0.40s; }
        .pooh-text .char:nth-child(7) { animation-delay: 0.48s; }
        .pooh-text .char:nth-child(8) { animation-delay: 0.56s; }
        .pooh-text .char:nth-child(9) { animation-delay: 0.64s; }
        .pooh-text .char:nth-child(10) { animation-delay: 0.72s; }
        .pooh-text .char:nth-child(11) { animation-delay: 0.80s; }
        .pooh-text .char:nth-child(12) { animation-delay: 0.88s; }
        .pooh-text .char:nth-child(13) { animation-delay: 0.96s; }
        .pooh-text .char:nth-child(14) { animation-delay: 1.04s; }
        .pooh-text .char:nth-child(15) { animation-delay: 1.12s; }
        .pooh-text .char:nth-child(16) { animation-delay: 1.20s; }
        .pooh-text .char:nth-child(17) { animation-delay: 1.28s; }
        .pooh-text .char:nth-child(18) { animation-delay: 1.36s; }
        .pooh-text .char:nth-child(19) { animation-delay: 1.44s; }
        .pooh-text .char:nth-child(20) { animation-delay: 1.52s; }
        .pooh-text .char:nth-child(21) { animation-delay: 1.60s; }
        .pooh-text .char:nth-child(22) { animation-delay: 1.68s; }
        .pooh-text .char:nth-child(23) { animation-delay: 1.76s; }
        .pooh-text .char:nth-child(24) { animation-delay: 1.84s; }
        .pooh-text .char:nth-child(25) { animation-delay: 1.92s; }
        .pooh-text .char:nth-child(26) { animation-delay: 2.00s; }
        .pooh-text .char:nth-child(27) { animation-delay: 2.08s; }
        .pooh-text .char:nth-child(28) { animation-delay: 2.16s; }
        .pooh-text .char:nth-child(29) { animation-delay: 2.24s; }
        .pooh-text .char:nth-child(30) { animation-delay: 2.32s; }
        .pooh-text .char:nth-child(31) { animation-delay: 2.40s; }
        .pooh-text .char:nth-child(32) { animation-delay: 2.48s; }
        .pooh-text .char:nth-child(33) { animation-delay: 2.56s; }
        .pooh-text .char:nth-child(34) { animation-delay: 2.64s; }
        .pooh-text .char:nth-child(35) { animation-delay: 2.72s; }
        .pooh-text .char:nth-child(36) { animation-delay: 2.80s; }
        .pooh-text .char:nth-child(37) { animation-delay: 2.88s; }
        .pooh-text .char:nth-child(38) { animation-delay: 2.96s; }
        .pooh-text .char:nth-child(39) { animation-delay: 3.04s; }
        .pooh-text .char:nth-child(40) { animation-delay: 3.12s; }
        @keyframes waveChar {
            0% { transform: translateY(0px) rotate(0deg); }
            40% { transform: translateY(-14px) rotate(2deg); }
            70% { transform: translateY(-4px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* 頁尾 */
        .footer-note {
            margin-top: 6px; font-size: 0.6rem; color: #b39ddb;
            text-align: center; border-top: 1px solid rgba(233, 30, 99, 0.06);
            padding-top: 6px; padding-bottom: 1px;
            letter-spacing: 0.3px; flex-shrink: 0; line-height: 1.2;
        }
        .footer-note span { color: #e91e63; font-weight: 600; }

        /* 大熊 */
        #bigBear {
            position: fixed; bottom: 4%; left: -15%; font-size: 32px;
            z-index: 9999; pointer-events: none; line-height: 1;
            transform-origin: center bottom; opacity: 0;
            transition: opacity 0.3s ease;
        }
        #bigBear.active { opacity: 0.7; animation: bearWalk 9s ease-in-out infinite; }
        @keyframes bearWalk {
            0% { transform: translateX(-10vw) scale(0.2); opacity: 0.5; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateX(100vw) scale(1.8); opacity: 0.3; }
        }

        /* 煙火 */
        #fireworksCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9998; display: none;
        }
        #fireworksCanvas.active { display: block; }

        /* 彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25);

            const allDone = targets.every(t => t.date - now <= 0);
            if (allDone) return '🎉 超級厲害！我永遠為你驕傲！ 🏆';
            let minDays = Infinity;
            for (const t of targets) {
                const diff = t.date - now;
                if (diff > 0) {
                    const days = Math.ceil(diff / 86400000);
                    if (days < minDays) minDays = days;

        class Petal {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = Math.random() * petalCanvas.width;
                this.y = init ? Math.random() * petalCanvas.height : -20 - Math.random() * 40;
                this.size = 6 + Math.random() * 12;
                this.speedY = 0.4 + Math.random() * 0.8;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.wobble = Math.random() * 0.03;
                this.wobbleSpeed = 0.005 + Math.random() * 0.01;
                this.phase = Math.random() * Math.PI * 2;
                this.alpha = 0.5 + Math.random() * 0.4;
                const colors = ['rgba(244, 143, 177, ', 'rgba(233, 30, 99, ', 'rgba(255, 182, 193, ', 'rgba(240, 98, 146, ', 'rgba(255, 105, 180, '];
                this.colorBase = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.phase) * this.wobble;
                this.phase += this.wobbleSpeed;
                this.rotation += this.rotSpeed;
                if (this.x < 0) this.x = petalCanvas.width;
                if (this.x > petalCanvas.width) this.x = 0;
                if (this.y > petalCanvas.height + 30) this.reset(false);
            }
            draw() {
                pCtx.globalAlpha = this.alpha;
                pCtx.save();
                pCtx.translate(this.x, this.y);
                pCtx.rotate(this.rotation);
                const s = this.size;
                pCtx.beginPath();
                pCtx.ellipse(0, 0, s * 0.6, s * 0.4, 0, 0, Math.PI * 2);
                pCtx.fillStyle = this.colorBase + this.alpha + ')';
                pCtx.fill();
                pCtx.restore();
                pCtx.globalAlpha = 1;
            }
        }

                if (this.x > heartCanvas.width + 50) this.x = -50;
                if (this.y > heartCanvas.height + 60) this.reset(false);
            }
            draw() {
                hCtx.save();
                hCtx.globalAlpha = Math.max(0, Math.min(1, this.currentAlpha));
                hCtx.translate(this.x, this.y);
                hCtx.rotate(this.rotation);
                hCtx.scale(this.currentScale, this.currentScale);
                if (this.glow) { hCtx.shadowColor = this.color; hCtx.shadowBlur = 12; }

                hCtx.textBaseline = 'middle';

        class VHeart {

                this.y = init ? Math.random() * vCanvas.height : vCanvas.height + 30 + Math.random() * 80;

                this.scalePhase += this.scaleSpeed;
                this.rot += this.rotSpeed;
                if (this.isBurst) {
                    this.speedY += this.gravity;
                    this.drift *= 0.985;
                    this.life++;
                    this.alpha = Math.max(0, 1 - this.life / this.maxLife);
                    if (this.life >= this.maxLife) this.reset(false, false);

                    this.x += this.drift + Math.sin(this.phase) * 1.15;

            update() {
                this.life++;

                if (this.life >= this.maxLife) this.reset();

            draw() {
                vCtx.save();
                vCtx.globalAlpha = Math.max(0, this.alpha);
                vCtx.fillStyle = `hsl(${this.hue}, 100%, 72%)`;
                if (this.cross) {

                    vCtx.fillRect(this.x - s, this.y - this.size * 0.35, s * 2, this.size * 0.7);
                    vCtx.fillRect(this.x - this.size * 0.35, this.y - s, this.size * 0.7, s * 2);

                    vCtx.beginPath();
                    vCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    vCtx.fill();
                }
                vCtx.restore();
            }
        }

        function resizeFireworksCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFireworksCanvas);
        resizeFireworksCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 - 2 };
                this.alpha = 1;
                this.decay = 0.01 + Math.random() * 0.022;
                this.size = 2 + Math.random() * 4;
                this.gravity = 0.05;
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bb5', '#f9ca24', '#ff9ff3', '#ff4757', '#2ed573'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 30 + Math.floor(Math.random() * 20);
            for (let i = 0; i < count; i++) particles.push(new FireworkParticle(x, y, color));
        }

        function animateFireworks() {
            if (!fireworksActive) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
            if (!isHidden()) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.1) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height * 0.6 + 20;
                    createExplosion(x, y);
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();
                    if (p.alpha <= 0) particles.splice(i, 1);
                }
            }
            fAnimationId = requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            if (fireworksActive) return;
            fireworksActive = true;
            canvas.classList.add('active');
            particles = [];
            if (fAnimationId) cancelAnimationFrame(fAnimationId);
            animateFireworks();
        }

        function stopFireworks() {
            fireworksActive = false;
            canvas.classList.remove('active');
            if (fAnimationId) { cancelAnimationFrame(fAnimationId); fAnimationId = null; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = [];
        }

        function shouldFireworksBeActive() {
            const now = new Date();
            for (const t of targets) {
                const diffMs = t.date - now;
                const days = Math.ceil(diffMs / 86400000);
                if (days >= 0 && days <= 3) return true;
            }
            return false;
        }

        function updateCountdown() {
            const now = new Date();
            if (shouldFireworksBeActive()) startFireworks(); else stopFireworks();

            const qixi = isQixi();
            const valentine = isValentineDay();

            targets.forEach(t => {
                const diffMs = t.date - now;
                const isDone = diffMs <= 0;
                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const cardEl = document.getElementById(t.cardId);
                const labelEl = document.getElementById(t.labelId);
                if (!dEl || !cardEl) return;

                cardEl.classList.toggle('qixi', qixi);
                cardEl.classList.toggle('valentine', !qixi && valentine);

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00'; mEl.textContent = '00'; sEl.textContent = '00';
                    cardEl.classList.add('done');
                    cardEl.classList.remove('urgent');
                    labelEl.textContent = t.name + ' ✅ 已完成';
                    return;
                }
                cardEl.classList.remove('done');
                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.ceil(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;
                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);
                labelEl.textContent = t.name + ' 倒數 ' + days + ' 天';
                if (days >= 1 && days <= 5) cardEl.classList.add('urgent');
                else cardEl.classList.remove('urgent');
            });
        }

        // ============================================================
        // 5. ★★★ 音樂自動播放系統 ★★★
        // ============================================================
        const audio = document.getElementById('girlfriendPiano');
        const musicBtn = document.getElementById('musicFloatBtn');
        const musicHint = document.getElementById('musicHint');
        const tapHint = document.getElementById('tapHint');

        let audioUnlocked = false;   // 是否已成功播放過
        let musicReady = false;      // 音檔是否可播放
        let listenersAttached = false;

        function updateMusicUI(playing) {
            if (playing) {
                musicBtn.classList.add('playing');
                musicBtn.textContent = '🎵';
                musicHint.classList.add('hide');
                musicHint.classList.remove('show');
                tapHint.classList.remove('show');
            } else {
                musicBtn.classList.remove('playing');
                musicBtn.textContent = '🎹';
            }
        }

        function showTapHintIfNeeded() {
            // 只有在 9/14 且尚未播放時才顯示
            if (isMusicPhotoValentine() && !audioUnlocked) {
                tapHint.classList.add('show');
            }
        }

        // 嘗試播放
        function attemptPlay(isAuto) {
            if (audioUnlocked) return;
            if (audio.paused === false) { audioUnlocked = true; updateMusicUI(true); return; }
            const p = audio.play();
            if (p && typeof p.then === 'function') {
                p.then(() => {
                    audioUnlocked = true;
                    updateMusicUI(true);
                    // 成功後移除所有監聽
                    detachUnlockListeners();
                }).catch(() => {
                    // 自動播放被阻擋
                    if (isAuto) {
                        showTapHintIfNeeded();
                        attachUnlockListeners();
                    }
                });
            }
        }

        // 使用者互動解鎖
        const unlockEvents = ['click', 'touchstart', 'touchend', 'pointerdown', 'keydown', 'scroll'];
        const unlockHandler = () => {
            if (audioUnlocked) { detachUnlockListeners(); return; }
            attemptPlay(false);
        };

        function attachUnlockListeners() {
            if (listenersAttached) return;
            listenersAttached = true;
            unlockEvents.forEach(e => {
                document.addEventListener(e, unlockHandler, { passive: true, once: false });
            });
        }

        function detachUnlockListeners() {
            if (!listenersAttached) return;
            listenersAttached = false;
            unlockEvents.forEach(e => {
                document.removeEventListener(e, unlockHandler);
            });
        }

        // 音檔就緒後嘗試自動播放
        audio.addEventListener('canplaythrough', () => {
            musicReady = true;
            // 只有 9/14 才自動播放
            if (isMusicPhotoValentine()) {
                attemptPlay(true);
            }
        }, { once: true });

        audio.addEventListener('error', () => {
            musicReady = false;
            if (isMusicPhotoValentine()) {
                musicHint.textContent = '😢 音樂載入失敗，請確認網路連線或稍後再試';
                musicHint.classList.add('show');
                musicHint.classList.remove('hide');
            }
        });

        // 手動按鈕
        musicBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    audioUnlocked = true;
                    updateMusicUI(true);
                    detachUnlockListeners();
                }).catch(() => {
                    musicHint.textContent = '😢 無法播放，請確認瀏覽器允許播放音訊';
                    musicHint.classList.add('show');
                    musicHint.classList.remove('hide');
                });
            } else {
                audio.pause();
                updateMusicUI(false);
            }
        });

        // 頁面載入後立即嘗試（若瀏覽器已允許自動播放）
        window.addEventListener('load', () => {
            if (isMusicPhotoValentine() && musicReady) {
                attemptPlay(true);
            }
        });

        // ============================================================
        // 6. 彈窗
        // ============================================================
        const DEFAULT_GIF = 'https://raw.githubusercontent.com/dustinchen26/test/refs/heads/master/pooh-pooh-and-piglet.gif';

        function showModal(opts) {
            const {
                examName, days, cheerText = '', isAllDone = false,
                emoji = '📚', qixi = false, valentine = null, musicPhoto = false
            } = opts || {};

            let titleText, reminderHtml, iconEmoji, btnText, boxClass = '';

            if (musicPhoto) {
                boxClass = 'valentine-box';
                iconEmoji = '🎶';
                titleText = '🎶9/14音樂&相片情人節快樂!🎶';
                reminderHtml = '與妳相遇~好幸運❤️';
                btnText = '🎹 聽聽這首小幸運 🎹';
            } else if (valentine) {
                boxClass = 'valentine-box';
                iconEmoji = valentine.emoji;
                titleText = `💘 ${valentine.name}快樂 💘`;
                reminderHtml = `🌹 今天是 ${valentine.name}，只想對你說：我愛你 🌹`;
                btnText = '💕 我也愛你 💕';
            } else if (qixi) {
                boxClass = 'valentine-box';
                iconEmoji = '❤️';
                titleText = 'Winny，我愛你 ❤️';
                reminderHtml = '謝謝你來到我的生命裡。';
                btnText = '💕 我也愛你 💕';
            } else if (isAllDone) {
                iconEmoji = '🏆';
                titleText = '🎉 所有考試已完成！Winny 你太棒了！ 🎉';
                reminderHtml = '🌟 你已經完成了所有挑戰，超級厲害！ 🌟';
                btnText = '💪 我會全力以赴！';
            } else if (days === 0) {
                iconEmoji = emoji || '🎯';
                titleText = examName + ' 就是今天！';
                reminderHtml = '🎉 就是今天！全力以赴，Winny 加油！ 🎉';
                btnText = '💪 我會全力以赴！';
            } else if (days > 0) {
                iconEmoji = emoji || '📚';
                titleText = examName + ' 倒數 ' + days + ' 天';
                reminderHtml = '⏰ 只剩 <strong>' + days + '</strong> 天，Winny 加油！ 💪';
                btnText = '💪 我會全力以赴！';
            } else {
                iconEmoji = '✅';
                titleText = examName + ' 已結束！';
                reminderHtml = '🎉 你已經完成了 ' + examName + '，表現超級棒！ 🎉';
                btnText = '💪 我會全力以赴！';
            }

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box ${boxClass}">
                    <div class="modal-icon">${iconEmoji}</div>
                    <img class="modal-gif" src="${DEFAULT_GIF}" alt="小熊維尼與小豬" loading="lazy" />
                    <h2>${titleText}</h2>
                    <div class="cheer-text">${cheerText}</div>
                    <div class="countdown-reminder">${reminderHtml}</div>
                    <button class="modal-close-btn" id="modalCloseBtn">${btnText}</button>
                </div>
            `;
            document.body.appendChild(overlay);
            const closeModal = () => { overlay.remove(); };
            overlay.querySelector('#modalCloseBtn').addEventListener('click', () => {
                closeModal();
                if (musicPhoto) {
                    // 點按鈕後，嘗試播放音樂
                    setTimeout(() => {
                        if (audio.paused) {
                            audio.play().then(() => {
                                audioUnlocked = true;
                                updateMusicUI(true);
                                detachUnlockListeners();
                            }).catch(() => {});
                        }
                    }, 200);
                }
            });
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
        }

        // ============================================================
        // 7. 主題套用
        // ============================================================
        function applyDailyTheme() {
            const qixi = isQixi();
            const valentine = getValentineInfo();
            const isV = !!valentine;
            const isMusicPhoto = isMusicPhotoValentine();

            const bodyEl = document.body;
            const containerEl = document.getElementById('mainContainer');
            const cheerEl = document.getElementById('cheerMessage');
            const subEl = document.getElementById('subText');
            const bannerEl = document.getElementById('valentineBanner');
            const dividerDot = document.getElementById('dividerDot');
            const photoSection = document.getElementById('photoMusicSection');

            bodyEl.classList.toggle('valentine-mode', (isV || isMusicPhoto) && !qixi);
            containerEl.classList.toggle('valentine-mode', (isV || isMusicPhoto) && !qixi);

            cheerEl.classList.toggle('qixi', qixi);
            cheerEl.classList.toggle('valentine', (isV || isMusicPhoto) && !qixi);
            cheerEl.textContent = getTodayCheer();

            if (isMusicPhoto) {
                bannerEl.textContent = '🎶 音樂&相片情人節快樂!~專屬 Winny 的浪漫日 🎶';
                bannerEl.classList.add('show');
            } else if (isV && !qixi) {
                bannerEl.textContent = `${valentine.emoji} 今天是 ${valentine.name} ・ 專屬 Winny 的浪漫日 ${valentine.emoji}`;
                bannerEl.classList.add('show');
            } else {
                bannerEl.classList.remove('show');
                bannerEl.textContent = '';
            }

            if (qixi) {
                subEl.textContent = '💖 七夕快樂，我的寶貝';
            } else if (isMusicPhoto) {
                subEl.textContent = '🎶 音樂情人節快樂!!! · 相片情人節快樂!!!，聽聽我彈的琴';
            } else if (isV) {
                subEl.textContent = `${valentine.emoji} ${valentine.name}快樂，我最愛你`;
            } else {
                subEl.textContent = '每天都為你打氣，開心迎接挑戰 ✨';
            }

            if (dividerDot) {
                dividerDot.textContent = qixi ? '💞' : ((isV || isMusicPhoto) ? '💘' : '❤️');
            }

            // 9/14：顯示照片與音樂
            if (isMusicPhoto && !qixi) {
                photoSection.classList.add('show');
                musicBtn.classList.add('show');
                musicHint.classList.add('show');
                musicHint.classList.remove('hide');
                // 顯示後嘗試播放
                setTimeout(() => attemptPlay(true), 300);
            } else {
                photoSection.classList.remove('show');
                musicBtn.classList.remove('show');
                tapHint.classList.remove('show');
                if (!audio.paused) { audio.pause(); }
                updateMusicUI(false);
            }

            // 背景特效
            if (qixi) {
                stopPetals(); stopValentineFX(); startHeartRain();
            } else if (isV || isMusicPhoto) {
                stopHeartRain(); stopPetals(); startValentineFX();
            } else {
                stopHeartRain(); stopValentineFX(); startPetals();
            }

            renderPoohText(getPoohText());

            return { qixi, valentine, isMusicPhoto };
        }

        // ============================================================
        // 8. 初始化
        // ============================================================
        function init() {
            // 先套用主題與特效
            const { qixi, valentine, isMusicPhoto } = applyDailyTheme();

            // 倒數啟動
            updateCountdown();
            setInterval(updateCountdown, 1000);

            // 跨日自動更新
            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                if (now.toDateString() !== lastDateStr) {
                    lastDateStr = now.toDateString();
                    applyDailyTheme();
                }
            }, 60000);

            // 開場彈窗（延遲 800ms，避免與首屏動畫搶資源）
            const now = new Date();
            const upcomingExams = targets
                .map(t => {
                    const diff = t.date - now;
                    const days = Math.ceil(diff / 86400000);
                    return { ...t, diff, days };
                })
                .filter(e => e.days >= 0);

            const pureMsg = getTodayCheer().replace(/（民國.*）/, '').trim();

            setTimeout(() => {
                if (qixi) {
                    showModal({ qixi: true, cheerText: pureMsg });
                } else if (isMusicPhoto) {
                    showModal({
                        musicPhoto: true,
                        cheerText: '🎶 還記得這首這首鋼琴曲嗎?~My Dear~'
                    });
                } else if (valentine) {
                    showModal({ valentine, cheerText: pureMsg });
                } else if (upcomingExams.length === 0) {
                    showModal({ isAllDone: true, cheerText: pureMsg });
                } else {
                    const nearest = upcomingExams.reduce((a, b) => a.days < b.days ? a : b);
                    showModal({
                        examName: nearest.name,
                        days: nearest.days,
                        cheerText: pureMsg,
                        emoji: nearest.emoji
                    });
                }
            }, 800);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
