        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans TC', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 40%, #e8eaf6 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景漂浮愛心裝飾 */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-hearts span {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.15;
            animation: floatHeart 18s infinite alternate ease-in-out;
            color: #e91e63;
        }
        .bg-hearts span:nth-child(1) { top: 8%; left: 5%; animation-duration: 16s; font-size: 3rem; }
        .bg-hearts span:nth-child(2) { top: 20%; right: 8%; animation-duration: 20s; font-size: 2.4rem; animation-delay: 2s; }
        .bg-hearts span:nth-child(3) { bottom: 25%; left: 10%; animation-duration: 22s; font-size: 4rem; animation-delay: 4s; }
        .bg-hearts span:nth-child(4) { bottom: 10%; right: 5%; animation-duration: 18s; font-size: 2.8rem; animation-delay: 1s; }
        .bg-hearts span:nth-child(5) { top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 24s; font-size: 5rem; animation-delay: 3s; opacity: 0.06; }
        .bg-hearts span:nth-child(6) { top: 5%; left: 45%; animation-duration: 19s; font-size: 2rem; animation-delay: 5s; }
        .bg-hearts span:nth-child(7) { bottom: 40%; right: 3%; animation-duration: 21s; font-size: 3.2rem; animation-delay: 0.5s; }
        .bg-hearts span:nth-child(8) { top: 60%; left: 3%; animation-duration: 17s; font-size: 2.6rem; animation-delay: 3.5s; }

        @keyframes floatHeart {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-40px) rotate(8deg) scale(1.05); }
            100% { transform: translateY(20px) rotate(-5deg) scale(0.95); }
        }

        /* ----- 主卡片容器 ----- */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 880px;
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 48px;
            padding: 40px 36px 46px;
            box-shadow: 0 25px 60px rgba(233, 30, 99, 0.15), 0 8px 24px rgba(156, 39, 176, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        /* ----- 標題區域 ----- */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 2.4rem;
            color: #4a148c;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(233, 30, 99, 0.15);
        }
        .header h1 .heart {
            color: #e91e63;
            display: inline-block;
            animation: pulseHeart 1.6s infinite alternate;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            100% { transform: scale(1.18); }
        }
        .header .sub {
            font-size: 1.05rem;
            color: #7b4b8a;
            font-weight: 300;
            margin-top: 6px;
            letter-spacing: 4px;
            opacity: 0.85;
        }
        .header .sub span {
            font-weight: 400;
            color: #d81b60;
        }

        /* 分隔裝飾 */
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin: 6px 0 24px;
        }
        .divider .line {
            flex: 1;
            max-width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e91e63, transparent);
            border-radius: 2px;
        }
        .divider .dot {
            color: #e91e63;
            font-size: 1.2rem;
        }

        /* ----- 倒計時卡片（兩個並排） ----- */
        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 24px 20px 28px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 6px 20px rgba(156, 39, 176, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(156, 39, 176, 0.12);
        }

        .card .exam-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #4a148c;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .card .exam-date {
            font-size: 0.9rem;
            font-weight: 300;
            color: #7b4b8a;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        .card .exam-date .roc {
            font-weight: 400;
            color: #6a1b9a;
        }

        .countdown-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 4px;          /* 縮小間距 */
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            padding: 0 2px;
        }
        .countdown-display .time-block {
            display: inline-flex;
            align-items: baseline;
            gap: 1px;
        }
        .countdown-display .num {

            font-weight: 700;

            color: #4a148c;
            line-height: 1.2;

        }

            color: #7b4b8a;

            font-weight: 600;
            color: #e91e63;
            letter-spacing: 1px;
        }

        }

            color: #7b4b8a;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

            animation: sparkle 2.4s infinite alternate;
        }
        @keyframes sparkle {
            0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.15) rotate(8deg); opacity: 1; }

        .cheer-message {
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: #4a148c;
            background: rgba(255, 255, 255, 0.4);

            -webkit-backdrop-filter: blur(4px);

            border-radius: 60px;
            display: inline-block;
            max-width: 100%;

            border: 1px solid rgba(255, 255, 255, 0.5);

        .cheer-message:hover {
            background: rgba(255, 255, 255, 0.6);

            color: #b39ddb;
            letter-spacing: 2px;

        }

            "加油Winny！你的專注力會帶你通過考驗！🔦",
            "Winny寶貝，你是我最勇敢的女孩，加油！👸",
            "親愛的，把考試當作遊戲，輕鬆應對！🎮",
            "Winny，你的實力值得被看見，發光吧！🌟"
        ];

        // ============================================================
        // 3. 取得「今天」的索引（一年中的第幾天）
        // ============================================================
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            return Math.floor(diff / (1000 * 60 * 60 * 24));
        }

        function getTodayCheer() {
            const now = new Date();
            const dayOfYear = getDayOfYear(now);
            const idx = dayOfYear % CHEER_MESSAGES.length;
            return CHEER_MESSAGES[idx];
        }

        // ============================================================
        // 4. 更新倒計時
        // ============================================================
        function padZero(n) {
            return String(n).padStart(2, '0');
        }

        function updateCountdown() {
            const now = new Date();

            targets.forEach(t => {
                const targetDate = t.date;
                const diffMs = targetDate - now;
                const isDone = diffMs <= 0;

                const dEl = document.getElementById(t.dId);
                const hEl = document.getElementById(t.hId);
                const mEl = document.getElementById(t.mId);
                const sEl = document.getElementById(t.sId);
                const statusEl = document.getElementById(t.statusId);
                const cardEl = document.getElementById(t.cardId);

                if (isDone) {
                    dEl.textContent = '0';
                    hEl.textContent = '00';
                    mEl.textContent = '00';
                    sEl.textContent = '00';
                    statusEl.textContent = '🎉 考試已結束！';
                    statusEl.className = 'status-msg done';
                    cardEl.classList.add('done-card');
                    return;
                }

                cardEl.classList.remove('done-card');

                const totalSec = Math.floor(diffMs / 1000);
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                dEl.textContent = days;
                hEl.textContent = padZero(hours);
                mEl.textContent = padZero(minutes);
                sEl.textContent = padZero(seconds);

                if (days > 0) {
                    statusEl.textContent = `📅 距離考試還有 ${days} 天`;
                    statusEl.className = 'status-msg';
                } else if (days === 0) {
                    statusEl.textContent = '🔥 就是今天！加油！！';
                    statusEl.className = 'status-msg';
                } else {
                    statusEl.textContent = '⏳ 即將到來！';
                    statusEl.className = 'status-msg';
                }
            });
        }

        // ============================================================
        // 5. 初始化 & 定時器
        // ============================================================
        function init() {
            const cheerEl = document.getElementById('cheerMessage');
            cheerEl.textContent = getTodayCheer();

            updateCountdown();
            setInterval(updateCountdown, 1000);

            let lastDateStr = new Date().toDateString();
            setInterval(() => {
                const now = new Date();
                const todayStr = now.toDateString();
                if (todayStr !== lastDateStr) {
                    lastDateStr = todayStr;
                    cheerEl.textContent = getTodayCheer();
                }
            }, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
